<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Calculator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: Tahoma, sans-serif; }
html, body { width: 100%; height: 100%; background: #ece9d8; display: flex; flex-direction: column; }
.calc-menu { background: #ece9d8; padding: 2px 6px; font-size: 11px; display: flex; gap: 12px; border-bottom: 1px solid #d4d0c8; }
.calc-menu span { cursor: pointer; }
.calc-menu span:hover { color: #0055ea; }

.calc-body { padding: 8px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.calc-display-wrap { background: #fff; border: 1px inset #808080; height: 28px; display: flex; align-items: center; justify-content: flex-end; padding: 0 6px; }
.calc-display { font-family: 'Courier New', monospace; font-size: 18px; font-weight: bold; color: #000; }

.calc-row-top { display: grid; grid-template-columns: 36px 1fr 1fr 1fr; gap: 5px; }
.btn-box { background: linear-gradient(to bottom, #fdfdfd 0%, #ece9d8 100%); border: 1px outset #fff; border-radius: 3px; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; }
.btn-box:active { border-style: inset; }
.btn-red { color: #d00000; font-weight: bold; }
.btn-blue { color: #0000cc; font-weight: bold; }

.calc-main-grid { display: grid; grid-template-columns: 36px repeat(4, 1fr); gap: 5px; flex: 1; }
.btn-calc { background: linear-gradient(to bottom, #fdfdfd 0%, #ece9d8 100%); border: 1px outset #fff; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; min-height: 26px; }
.btn-calc:active { border-style: inset; }
</style>
</head>
<body>
<div class="calc-menu">
    <span>Edit</span><span>View</span><span>Help</span>
</div>
<div class="calc-body">
    <div class="calc-display-wrap">
        <div class="calc-display" id="display">0.</div>
    </div>
    <div class="calc-row-top">
        <div class="btn-box" id="memFlag" style="background:#ece9d8;"></div>
        <div class="btn-box btn-red" onclick="backspace()">Backspace</div>
        <div class="btn-box btn-red" onclick="clearEntry()">CE</div>
        <div class="btn-box btn-red" onclick="clearAll()">C</div>
    </div>
    <div class="calc-main-grid">
        <div class="btn-calc btn-red" onclick="memOp('MC')">MC</div>
        <div class="btn-calc btn-blue" onclick="input('7')">7</div>
        <div class="btn-calc btn-blue" onclick="input('8')">8</div>
        <div class="btn-calc btn-blue" onclick="input('9')">9</div>
        <div class="btn-calc btn-red" onclick="setOp('/')">/</div>

        <div class="btn-calc btn-red" onclick="memOp('MR')">MR</div>
        <div class="btn-calc btn-blue" onclick="input('4')">4</div>
        <div class="btn-calc btn-blue" onclick="input('5')">5</div>
        <div class="btn-calc btn-blue" onclick="input('6')">6</div>
        <div class="btn-calc btn-red" onclick="setOp('*')">*</div>

        <div class="btn-calc btn-red" onclick="memOp('MS')">MS</div>
        <div class="btn-calc btn-blue" onclick="input('1')">1</div>
        <div class="btn-calc btn-blue" onclick="input('2')">2</div>
        <div class="btn-calc btn-blue" onclick="input('3')">3</div>
        <div class="btn-calc btn-red" onclick="setOp('-')">-</div>

        <div class="btn-calc btn-red" onclick="memOp('M+')">M+</div>
        <div class="btn-calc btn-blue" onclick="input('0')">0</div>
        <div class="btn-calc btn-blue" onclick="negate()">+/-</div>
        <div class="btn-calc btn-blue" onclick="input('.')">.</div>
        <div class="btn-calc btn-red" onclick="setOp('+')">+</div>
    </div>
    <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap: 5px;">
        <div class="btn-calc btn-blue" onclick="sqrt()">sqrt</div>
        <div class="btn-calc btn-blue" onclick="percent()">%</div>
        <div class="btn-calc btn-blue" onclick="inverse()">1/x</div>
        <div class="btn-calc btn-red" onclick="calculate()">=</div>
    </div>
</div>

<script>
let cur = '0', prev = null, op = null, reset = false, mem = 0;
const d = document.getElementById('display');
function update() { d.innerText = (cur.endsWith('.') ? cur : cur + (cur.includes('.') ? '' : '.')); }
function input(c) {
    if (reset) { cur = '0'; reset = false; }
    if (c === '.' && cur.includes('.')) return;
    cur = (cur === '0' && c !== '.') ? c : cur + c;
    update();
}
function setOp(o) { if (op && !reset) calculate(); prev = parseFloat(cur); op = o; reset = true; }
function calculate() {
    if (!op || prev === null) return;
    const a = prev, b = parseFloat(cur); let r = 0;
    if (op === '+') r = a + b; if (op === '-') r = a - b;
    if (op === '*') r = a * b; if (op === '/') r = b === 0 ? NaN : a / b;
    cur = isNaN(r) ? 'Error' : String(Math.round(r * 1e8) / 1e8);
    op = null; prev = null; reset = true; update();
}
function clearAll() { cur = '0'; prev = null; op = null; reset = false; update(); }
function clearEntry() { cur = '0'; update(); }
function backspace() { cur = cur.length > 1 ? cur.slice(0, -1) : '0'; update(); }
function negate() { cur = String(-parseFloat(cur)); update(); }
function sqrt() { cur = String(Math.sqrt(parseFloat(cur))); reset = true; update(); }
function percent() { cur = String((prev * parseFloat(cur)) / 100); reset = true; update(); }
function inverse() { cur = String(1 / parseFloat(cur)); reset = true; update(); }
function memOp(act) {
    const v = parseFloat(cur);
    if (act === 'MC') mem = 0;
    if (act === 'MR') { cur = String(mem); reset = true; }
    if (act === 'MS') mem = v;
    if (act === 'M+') mem += v;
    document.getElementById('memFlag').innerText = mem !== 0 ? 'M' : '';
    update();
}
update();
</script>
</body>
</html>
