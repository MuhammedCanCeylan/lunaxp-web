<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winamp</title>
<style>
/* ============================================================
   WINAMP 2.x — WINDOWS XP SÜRÜMÜ
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #ECE9D8; color: #000;
    font-family: Tahoma, Verdana, Geneva, sans-serif; font-size: 11px;
    user-select: none; -webkit-user-select: none; cursor: default;
}

#app { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; background: #ECE9D8; }

#menubar {
    position: relative; z-index: 300; flex: 0 0 auto; display: flex; align-items: stretch;
    background: #ECE9D8; border-bottom: 1px solid #D4D0C8; padding: 1px 2px;
}
.menu { padding: 4px 9px 3px 9px; font-size: 11px; color: #000; cursor: default; border: 1px solid transparent; border-bottom: none; }
.menu:hover, .menu.open { background: #316AC5; color: #fff; }
.menu.open { border-color: #316AC5; }

.dropdown {
    position: absolute; top: 100%; min-width: 215px; background: #FFFFFF;
    border: 1px solid #A0A0A0; box-shadow: 3px 3px 6px rgba(0, 0, 0, 0.35);
    padding: 2px; display: none; z-index: 400;
}
.dropdown.show { display: block; }
.dd-item { display: flex; justify-content: space-between; gap: 26px; padding: 4px 12px 4px 24px; font-size: 11px; color: #000; white-space: nowrap; cursor: default; position: relative; }
.dd-item:hover { background: #316AC5; color: #fff; }
.dd-item.disabled { color: #9A9A9A; pointer-events: none; }
.dd-item .shortcut { opacity: 0.75; font-size: 10px; }
.dd-sep { height: 1px; background: #D4D0C8; margin: 3px 2px; }

#playerArea {
    flex: 0 0 auto; background: linear-gradient(180deg, #3E3E3E 0%, #2A2A2A 55%, #1E1E1E 100%);
    padding: 7px 8px 8px 8px; display: flex; flex-direction: column; gap: 6px;
    border-bottom: 2px solid #0A0A0A; box-shadow: inset 0 1px 0 #5C5C5C;
}

#displayPanel {
    background: #000; border: 2px solid; border-color: #0A0A0A #5A5A5A #5A5A5A #0A0A0A;
    padding: 4px 5px 5px 5px; display: flex; flex-direction: column; gap: 3px;
}

#titleScroll { overflow: hidden; white-space: nowrap; height: 15px; line-height: 15px; color: #00FF00; font-size: 11px; letter-spacing: 0.5px; text-shadow: 0 0 5px rgba(0, 255, 0, 0.55); }
#titleInner { display: inline-block; padding-right: 20px; }

#displayRow { display: flex; align-items: flex-end; gap: 8px; height: 46px; }

#timeDisplay {
    font-family: "Lucida Console", "Courier New", monospace; font-size: 26px; line-height: 30px;
    color: #00FF00; text-shadow: 0 0 8px rgba(0, 255, 0, 0.75); letter-spacing: 1px; min-width: 88px; text-align: center;
}

#infoBlock { display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; padding-bottom: 4px; min-width: 52px; }
#infoBlock div { color: #00FF00; font-size: 10px; text-shadow: 0 0 4px rgba(0, 255, 0, 0.5); white-space: nowrap; }

#vis { flex: 1 1 auto; height: 44px; display: block; background: #000; border: 1px solid #1E1E1E; image-rendering: pixelated; }

#seekBar { position: relative; height: 11px; margin-top: 1px; background: #0B0B0B; border: 1px solid #3A3A3A; cursor: pointer; }
#seekFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: linear-gradient(180deg, #33FF66 0%, #00A020 100%); pointer-events: none; }
#seekKnob { position: absolute; top: -2px; left: 0%; width: 7px; height: 15px; margin-left: -3px; background: linear-gradient(180deg, #EAEAEA 0%, #8A8A8A 100%); border: 1px solid #000; pointer-events: none; }
#timeLabels { display: flex; justify-content: space-between; color: #00C000; font-size: 10px; font-family: "Lucida Console", "Courier New", monospace; }

#controls { display: flex; justify-content: center; gap: 5px; padding: 2px 0; }
.wa-btn {
    width: 46px; height: 26px; display: flex; align-items: center; justify-content: center;
    font-family: Tahoma, sans-serif; font-size: 12px; line-height: 1; color: #DDDDDD;
    background: linear-gradient(180deg, #5E5E5E 0%, #383838 45%, #2A2A2A 100%);
    border: 2px solid; border-color: #8C8C8C #141414 #141414 #8C8C8C;
    cursor: pointer; outline: none; text-shadow: 0 1px 0 #000;
}
.wa-btn:hover { background: linear-gradient(180deg, #757575 0%, #454545 45%, #333333 100%); color: #00FF00; }
.wa-btn:active, .wa-btn.pressed { border-color: #141414 #8C8C8C #8C8C8C #141414; background: linear-gradient(180deg, #232323 0%, #383838 100%); color: #00FF00; }

#sliders { display: flex; gap: 18px; justify-content: center; padding-top: 1px; }
.sliderGroup { display: flex; align-items: center; gap: 6px; }
.sliderGroup label { color: #B8B8B8; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
.slider { position: relative; width: 110px; height: 14px; background: #0B0B0B; border: 1px solid #4A4A4A; cursor: pointer; }
.sliderFill { position: absolute; top: 0; bottom: 0; background: linear-gradient(180deg, #22DD44 0%, #0A7A18 100%); pointer-events: none; }
.sliderKnob { position: absolute; top: -2px; width: 7px; height: 16px; margin-left: -3px; background: linear-gradient(180deg, #EAEAEA 0%, #8A8A8A 100%); border: 1px solid #000; pointer-events: none; }

#playlistPanel { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; background: #000; border-top: 2px solid #0A0A0A; }
#plHeader { flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 3px 8px; background: linear-gradient(180deg, #4E4E4E 0%, #2C2C2C 100%); color: #00FF00; font-size: 10px; letter-spacing: 1px; border-bottom: 1px solid #000; box-shadow: inset 0 1px 0 #6A6A6A; }
#playlistBox { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 2px 0; }
.pl-item { padding: 2px 8px; color: #9C9C9C; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; }
.pl-item:hover { background: #143014; color: #CFFFD0; }
.pl-item.active { color: #00FF00; background: #0A2A0A; font-weight: bold; text-shadow: 0 0 4px rgba(0, 255, 0, 0.6); }

#statusbar { flex: 0 0 auto; display: flex; gap: 2px; padding: 2px; background: #ECE9D8; border-top: 1px solid #FFFFFF; box-shadow: inset 0 1px 0 #D4D0C8; }
.status-panel { border: 1px solid; border-color: #9D9D9D #FFFFFF #FFFFFF #9D9D9D; padding: 2px 7px; font-size: 11px; color: #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#statusMsg { flex: 1 1 auto; min-width: 0; }
#statusCount, #statusState { flex: 0 0 auto; }

#overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.32); display: none; align-items: center; justify-content: center; z-index: 900; }
#overlay.show { display: flex; }
.dialog { min-width: 340px; max-width: 90%; background: #ECE9D8; border: 1px solid #003C74; box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.5); }
.dialog-title { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 4px 8px; color: #FFFFFF; font-weight: bold; font-size: 11px; background: linear-gradient(180deg, #0058EE 0%, #3A93FF 8%, #0054E3 45%, #0054E3 88%, #3A93FF 100%); border-radius: 4px 4px 0 0; }
.dialog-close { width: 20px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: linear-gradient(180deg, #4E9BFF 0%, #0A55D8 100%); border: 1px solid #FFFFFF; border-radius: 3px; cursor: pointer; }
.dialog-body { padding: 14px 16px 10px 16px; }
.dialog-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 4px 14px 14px 14px; }
.xp-btn { min-width: 82px; padding: 4px 12px; font-family: Tahoma, sans-serif; font-size: 11px; color: #000; background: linear-gradient(180deg, #FFFFFF 0%, #F2F1EC 45%, #E2E0D8 100%); border: 1px solid #7F9DB9; border-radius: 3px; cursor: pointer; }
</style>
</head>
<body>

<div id="app">
    <div id="menubar">
        <div class="menu" data-menu="dosya">Dosya</div>
        <div class="menu" data-menu="calma">Çalma</div>
        <div class="menu" data-menu="gorunum">Görünüm</div>
        <div class="menu" data-menu="yardim">Yardım</div>
    </div>

    <div id="playerArea">
        <div id="displayPanel">
            <div id="titleScroll"><span id="titleInner">Winamp hazır</span></div>
            <div id="displayRow">
                <div id="timeDisplay">00:00</div>
                <div id="infoBlock">
                    <div><span id="kbpsVal">128</span> kbps</div>
                    <div><span id="khzVal">44</span> kHz</div>
                </div>
                <canvas id="vis"></canvas>
            </div>
            <div id="seekBar">
                <div id="seekFill"></div>
                <div id="seekKnob"></div>
            </div>
            <div id="timeLabels">
                <span id="curTime">00:00</span>
                <span id="totTime">00:00</span>
            </div>
        </div>

        <div id="controls">
            <button class="wa-btn" id="btnPrev" title="Önceki Parça (Z)">|◀</button>
            <button class="wa-btn" id="btnPlay" title="Çal (Boşluk)">▶</button>
            <button class="wa-btn" id="btnPause" title="Duraklat (C)">❚❚</button>
            <button class="wa-btn" id="btnStop" title="Durdur (V)">■</button>
            <button class="wa-btn" id="btnNext" title="Sonraki Parça (B)">▶|</button>
            <button class="wa-btn" id="btnEject" title="MP3 Dosyası Aç (Ctrl+O)">⏏</button>
        </div>

        <div id="sliders">
            <div class="sliderGroup">
                <label>Ses</label>
                <div class="slider" id="volSlider">
                    <div class="sliderFill" id="volFill"></div>
                    <div class="sliderKnob" id="volKnob"></div>
                </div>
            </div>
            <div class="sliderGroup">
                <label>Denge</label>
                <div class="slider" id="balSlider">
                    <div class="sliderFill" id="balFill"></div>
                    <div class="sliderKnob" id="balKnob"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="playlistPanel">
        <div id="plHeader">
            <span>ÇALMA LİSTESİ</span>
            <span id="plInfo">0 parça</span>
        </div>
        <div id="playlistBox"></div>
    </div>

    <div id="statusbar">
        <div class="status-panel" id="statusMsg">Hazır</div>
        <div class="status-panel" id="statusState">Durduruldu</div>
        <div class="status-panel" id="statusCount">[1/1]</div>
    </div>

    <div id="overlay">
        <div class="dialog" id="dialogBox">
            <div class="dialog-title">
                <span id="dialogTitle">Winamp Hakkında</span>
                <div class="dialog-close" id="dialogClose">✕</div>
            </div>
            <div class="dialog-body" id="dialogBody"></div>
            <div class="dialog-footer"><button class="xp-btn" id="dialogOk">Tamam</button></div>
        </div>
    </div>
</div>

<input type="file" id="fileInput" accept="audio/*" multiple style="display:none">
<audio id="audioEl" preload="metadata"></audio>

<script>
(function () {
    'use strict';

    /* DOĞRU GÖRECELİ DİZİN (static/screen/apps/winamp -> static/screen/music) */
    var MUSIC_BASE = '../../music/';

    var songs = [
        { name: '02 - Gülşen - Be Adam', file: '02 - Gⁿlsen - Be Adam.mp3' },
        { name: '04 - Mirkelam - Her Gece', file: '04 - Mirkelam Her Gece.mp3' },
        { name: '06 - Sibel Can - Padişah', file: '06 - Sibel Can - Padisah.mp3' },
        { name: '07 - Tarkan - Şıkıdım', file: '07 - Tarkan - Sikidim [Hepsi Senin Mi] _ [Official] _ [Sarki S÷zⁿ - Lyrics].mp3' },
        { name: '08 - Gülşen - Saz mı Caz mı', file: '08 - Gⁿlsen - Saz mi Caz mi.mp3' },
        { name: '09 - Murat Başaran - Bir Öpücük Kesmez', file: '09 - Murt Basarn - Bir ╓pcⁿk Kesmez.mp3' },
        { name: '10 - Demet Sağıroğlu - Arnavut Kaldırımı', file: '10 - Demet Sagiroglu - Arnavut Kaldirimi (Official Video).mp3' },
        { name: '11 - Emel Müftüoğlu - Hovarda', file: '11 - Emel Mⁿftⁿoglu - Hovarda.mp3' },
        { name: '12 - Tarkan - Şımarık', file: '12 - Tarkan - Simarik.mp3' },
        { name: '13 - Tarkan - Ölürüm Sana', file: '13 - TARKAN - ╓lⁿrⁿm Sana (Official Music Video).mp3' },
        { name: '14 - Nazan Öncel - Dillere Düşeceğiz', file: '14 - Nazan ╓ncel - Dillere Dⁿsecegiz Seninle.mp3' },
        { name: '15 - Grup Vitamin - Al Aşkını', file: '15 - GRUP VITAMIN - AL ASKINI SOK G╓Z▄NE (Official Music Video).mp3' },
        { name: '16 - Ufuk Yıldırım - Yaradana Yalvartma', file: '16 - Ufuk Yildirim - Yaradana Yalvartma.mp3' },
        { name: '17 - Mirkelam - Ah Bir Joker', file: '17 - Mirkelam - Ah Bir Joker.mp3' },
        { name: '18 - Mirkelam - Bağırıyorsam Sebebi Var', file: '18 - Mirkelam - Bagiriyorsam Sebebi Var.mp3' },
        { name: '19 - Ragga Oktay - Çukulata Kız', file: '19 - Ragga Oktay - ╟ukulata Kiz (╟ikolata Kiz 1998).mp3' },
        { name: '20 - Emrah - Narin Yarim', file: '20- Narin Yarim | EMRAH.mp3' },
        { name: '21 - Ali Güven - Yolcu', file: '21 - Ali Gⁿven - Yolcu (Official Video).mp3' },
        { name: '22 - Ümit Sayın - Hicran', file: '22 - ▄mit Sayin - Hicran.mp3' },
        { name: '24 - Reyhan Karaca - Sevdik Sevdalandık', file: '24 - Reyhan Karaca - Sevdik Sevdalandik.mp3' },
        { name: '25 - Sezen Aksu - Şinanay', file: '25 - Sezen Aksu - Sinanay.mp3' },
        { name: '30 - Mustafa Sandal - Araba', file: '30 - Mustafa Sandal - Araba.mp3' },
        { name: '31 - Emrah - Haydi Şimdi Gel', file: '31 - Emrah - Haydi Simdi Gel (Official Video).mp3' },
        { name: '32 - Çılgın Bediş - Yonca Evcimik', file: '32 - ╟ilgin Bedis Jenerik  ? Yonca Evcimik #YoncaEvcimik #╟ilginBedis.mp3' },
        { name: '33 - Ebru Gündeş - Fırtınalar', file: '33 - Ebru Gⁿndes - Firtinalar (Official Video).mp3' },
        { name: '85 - Barış Manço - Kara Sevda', file: '85 - baris manco - kara sevda.mp3' },
        { name: '86 - MFÖ - Sakın Gelme', file: '86 - MF╓ Sakin Gelme.mp3' }
    ];

    function encPath(p) {
        return encodeURI(p).replace(/#/g, '%23').replace(/\?/g, '%3F');
    }
    songs.forEach(function (s) { s.url = encPath(MUSIC_BASE + s.file); });

    var audio = document.getElementById('audioEl');
    var curIdx = 0, isPlaying = false, shuffleOn = false, repeatOn = false;
    var volLevel = 80, balLevel = 0;
    var audioCtx = null, analyser = null, pannerNode = null, freqData = null;

    function $(id) { return document.getElementById(id); }

    function fmtTime(sec) {
        if (!isFinite(sec) || sec < 0) sec = 0;
        sec = Math.floor(sec);
        return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
    }

    function setStatus(msg) { $('statusMsg').textContent = msg; }

    function setTitle(text) {
        var inner = $('titleInner');
        inner.textContent = text + '     ***     ' + text + '     ***     ';
        $('titleScroll').scrollLeft = 0;
    }

    setInterval(function () {
        var box = $('titleScroll');
        var inner = $('titleInner');
        if (inner.scrollWidth <= box.clientWidth) { box.scrollLeft = 0; return; }
        box.scrollLeft += 1;
        if (box.scrollLeft >= inner.scrollWidth / 2) box.scrollLeft = 0;
    }, 55);

    function initAudioGraph() {
        if (audioCtx) return;
        try {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            audioCtx = new AC();
            var src = audioCtx.createMediaElementSource(audio);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 128;
            analyser.smoothingTimeConstant = 0.72;
            freqData = new Uint8Array(analyser.frequencyBinCount);
            src.connect(analyser);

            if (typeof audioCtx.createStereoPanner === 'function') {
                pannerNode = audioCtx.createStereoPanner();
                analyser.connect(pannerNode);
                pannerNode.connect(audioCtx.destination);
            } else {
                analyser.connect(audioCtx.destination);
            }
        } catch (e) {}
    }

    var canvas = $('vis'), c2d = canvas.getContext('2d'), peakArr = [];
    function sizeCanvas() {
        var w = canvas.clientWidth || 200, h = canvas.clientHeight || 44;
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    }
    window.addEventListener('resize', sizeCanvas);

    function drawVisualizer() {
        requestAnimationFrame(drawVisualizer);
        sizeCanvas();
        var w = canvas.width, h = canvas.height;
        c2d.fillStyle = '#000000'; c2d.fillRect(0, 0, w, h);
        var count = Math.max(10, Math.floor(w / 7)), bw = w / count;
        var active = analyser && !audio.paused && !audio.ended && audio.currentTime > 0;
        if (peakArr.length !== count) peakArr = new Array(count).fill(0);

        for (var i = 0; i < count; i++) {
            var v;
            if (active) {
                analyser.getByteFrequencyData(freqData);
                var usable = Math.floor(freqData.length * 0.72);
                var idx = Math.floor(Math.pow(i / count, 1.35) * usable);
                v = Math.pow(freqData[idx] / 255, 0.85);
            } else {
                v = 0.06 + 0.10 * Math.abs(Math.sin(Date.now() / 420 + i * 0.45));
            }
            var bh = Math.max(2, v * (h - 3));
            peakArr[i] = Math.max(peakArr[i] - 0.9, bh);
            var grad = c2d.createLinearGradient(0, h - bh, 0, h);
            grad.addColorStop(0, '#4BFF6E'); grad.addColorStop(0.45, '#00E63C'); grad.addColorStop(1, '#00661A');
            c2d.fillStyle = grad; c2d.fillRect(i * bw + 1, h - bh, Math.max(1, bw - 2), bh);
            if (peakArr[i] > 3) {
                c2d.fillStyle = '#C8FFD0'; c2d.fillRect(i * bw + 1, h - peakArr[i] - 2, Math.max(1, bw - 2), 2);
            }
        }
    }

    function renderPlaylist() {
        var box = $('playlistBox'), frag = document.createDocumentFragment();
        songs.forEach(function (s, i) {
            var el = document.createElement('div');
            el.className = 'pl-item' + (i === curIdx ? ' active' : '');
            el.textContent = (i + 1) + '. ' + s.name;
            el.title = s.name;
            el.addEventListener('click', function () { loadTrack(i); play(); });
            frag.appendChild(el);
        });
        box.innerHTML = ''; box.appendChild(frag);
        $('plInfo').textContent = songs.length + ' parça';
        $('statusCount').textContent = '[' + (curIdx + 1) + '/' + songs.length + ']';
        var act = box.querySelector('.pl-item.active');
        if (act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest' });
    }

    function loadTrack(idx) {
        if (!songs.length) return;
        curIdx = ((idx % songs.length) + songs.length) % songs.length;
        var s = songs[curIdx];
        setTitle((curIdx + 1) + '. ' + s.name);
        setStatus('Yükleniyor: ' + s.name);
        audio.src = s.url;
        try { audio.load(); } catch (e) {}
        $('totTime').textContent = '00:00'; $('curTime').textContent = '00:00';
        $('seekFill').style.width = '0%'; $('seekKnob').style.left = '0%';
        renderPlaylist();
    }

    function play() {
        if (!audio.src) loadTrack(curIdx);
        initAudioGraph();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(function () {});
        var p = audio.play();
        if (p && p.catch) {
            p.catch(function () {
                setStatus('Parça çalınamadı — dosya bulunamadı.');
                $('statusState').textContent = 'Hata';
            });
        }
    }

    function pause() { audio.pause(); setStatus('Duraklatıldı'); }
    function stop() {
        audio.pause();
        try { audio.currentTime = 0; } catch (e) {}
        $('seekFill').style.width = '0%'; $('seekKnob').style.left = '0%';
        $('curTime').textContent = '00:00'; $('timeDisplay').textContent = '00:00';
        setStatus('Durduruldu');
    }

    function next() {
        if (shuffleOn && songs.length > 1) {
            var i; do { i = Math.floor(Math.random() * songs.length); } while (i === curIdx);
            loadTrack(i);
        } else {
            loadTrack(curIdx + 1);
        }
        play();
    }
    function prev() { loadTrack(curIdx - 1); play(); }

    function updateTimeUI() {
        var cur = audio.currentTime || 0, dur = audio.duration;
        $('curTime').textContent = fmtTime(cur); $('timeDisplay').textContent = fmtTime(cur);
        if (isFinite(dur) && dur > 0) {
            var pct = (cur / dur) * 100;
            $('seekFill').style.width = pct + '%'; $('seekKnob').style.left = pct + '%';
            $('totTime').textContent = fmtTime(dur);
        }
    }

    audio.addEventListener('timeupdate', updateTimeUI);
    audio.addEventListener('loadedmetadata', function () {
        if (isFinite(audio.duration)) $('totTime').textContent = fmtTime(audio.duration);
        setStatus('Çalınıyor: ' + songs[curIdx].name);
    });
    audio.addEventListener('play', function () {
        isPlaying = true; $('btnPlay').classList.add('pressed'); $('statusState').textContent = 'Çalıyor';
    });
    audio.addEventListener('pause', function () {
        isPlaying = false; $('btnPlay').classList.remove('pressed');
        if (audio.currentTime > 0 && !audio.ended) $('statusState').textContent = 'Duraklatıldı';
    });
    audio.addEventListener('ended', function () { if (repeatOn) { audio.currentTime = 0; play(); } else { next(); } });
    audio.addEventListener('error', function () {
        setStatus('Hata: dosya yüklenemedi — ' + (songs[curIdx] ? songs[curIdx].name : ''));
        $('statusState').textContent = 'Hata';
    });

    function bindSlider(el, onMove) {
        var dragging = false;
        function ratio(ev) {
            var r = el.getBoundingClientRect();
            var x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
            return Math.min(1, Math.max(0, x / r.width));
        }
        el.addEventListener('mousedown', function (e) { dragging = true; onMove(ratio(e)); e.preventDefault(); });
        document.addEventListener('mousemove', function (e) { if (dragging) onMove(ratio(e)); });
        document.addEventListener('mouseup', function () { dragging = false; });
    }

    function applyVolume() {
        audio.volume = Math.max(0, Math.min(1, volLevel / 100));
        $('volFill').style.width = volLevel + '%'; $('volKnob').style.left = volLevel + '%';
    }
    bindSlider($('volSlider'), function (r) { volLevel = Math.round(r * 100); applyVolume(); setStatus('Ses: ' + volLevel + '%'); });

    function applyBalance() {
        var pct = (balLevel + 100) / 2;
        $('balKnob').style.left = pct + '%';
        if (balLevel < 0) { $('balFill').style.left = pct + '%'; $('balFill').style.width = (50 - pct) + '%'; }
        else { $('balFill').style.left = '50%'; $('balFill').style.width = (pct - 50) + '%'; }
        if (pannerNode) pannerNode.pan.value = balLevel / 100;
    }
    bindSlider($('balSlider'), function (r) {
        balLevel = Math.round(r * 200 - 100); applyBalance();
        setStatus('Denge: ' + (balLevel === 0 ? 'Merkez' : (balLevel < 0 ? 'Sol ' + Math.abs(balLevel) : 'Sağ ' + balLevel)));
    });

    bindSlider($('seekBar'), function (r) {
        if (isFinite(audio.duration) && audio.duration > 0) {
            audio.currentTime = r * audio.duration; updateTimeUI();
        }
    });

    var fileInput = $('fileInput');
    fileInput.addEventListener('change', function () {
        var files = fileInput.files;
        if (!files || !files.length) return;
        var startIdx = songs.length;
        for (var i = 0; i < files.length; i++) {
            songs.push({ name: files[i].name.replace(/\.[^.]+$/, ''), url: URL.createObjectURL(files[i]) });
        }
        setStatus(files.length + ' dosya çalma listesine eklendi.');
        renderPlaylist(); loadTrack(startIdx); play(); fileInput.value = '';
    });

    function openFile() { fileInput.click(); }

    function showDialog(title, html) {
        $('dialogTitle').textContent = title; $('dialogBody').innerHTML = html; $('overlay').classList.add('show');
    }
    function hideDialog() { $('overlay').classList.remove('show'); }
    $('dialogClose').addEventListener('click', hideDialog);
    $('dialogOk').addEventListener('click', hideDialog);

    var menuDefs = {
        dosya: [
            { label: 'MP3 Dosyası Aç...', shortcut: 'Ctrl+O', action: openFile },
            { label: 'Çalma Listesine Ekle...', shortcut: 'Ctrl+A', action: openFile },
            { sep: true },
            { label: 'Kapat', shortcut: 'Alt+F4', action: function () { try { window.parent.postMessage({ type: 'closeApp', id: 'winamp' }, '*'); } catch (e) {} } }
        ],
        calma: [
            { label: 'Çal', shortcut: 'Boşluk', action: play },
            { label: 'Duraklat', shortcut: 'C', action: pause },
            { label: 'Durdur', shortcut: 'V', action: stop },
            { sep: true },
            { label: 'Önceki Parça', shortcut: 'Z', action: prev },
            { label: 'Sonraki Parça', shortcut: 'B', action: next }
        ],
        gorunum: [
            { label: 'Çalma Listesi', shortcut: 'Ctrl+L', action: function () { $('playlistPanel').style.display = ($('playlistPanel').style.display === 'none') ? 'flex' : 'none'; } },
            { label: 'Görsel Efekt', shortcut: 'Ctrl+V', action: function () { $('vis').style.display = ($('vis').style.display === 'none') ? 'block' : 'none'; } }
        ],
        yardim: [
            { label: 'Winamp Hakkında', shortcut: '', action: function () { showDialog('Winamp Hakkında', '<h3>Winamp 2.95</h3><p>Windows XP Simülasyonu Müzik Çalar.</p>'); } }
        ]
    };

    var openMenuKey = null;
    function buildMenus() {
        var bar = $('menubar');
        Array.prototype.forEach.call(bar.querySelectorAll('.dropdown'), function (d) { d.parentNode.removeChild(d); });
        Array.prototype.forEach.call(bar.querySelectorAll('.menu'), function (m) {
            var key = m.dataset.menu, defs = menuDefs[key];
            if (!defs) return;
            var left = m.offsetLeft, dd = document.createElement('div');
            dd.className = 'dropdown'; dd.dataset.for = key;
            defs.forEach(function (item) {
                if (item.sep) { var sep = document.createElement('div'); sep.className = 'dd-sep'; dd.appendChild(sep); return; }
                var el = document.createElement('div'); el.className = 'dd-item';
                var spanL = document.createElement('span'); spanL.textContent = item.label;
                var spanR = document.createElement('span'); spanR.className = 'shortcut'; spanR.textContent = item.shortcut || '';
                el.appendChild(spanL); el.appendChild(spanR);
                el.addEventListener('click', function (e) { e.stopPropagation(); hideMenus(); item.action(); });
                dd.appendChild(el);
            });
            dd.style.left = left + 'px'; bar.appendChild(dd);
            m.onclick = function (e) { e.stopPropagation(); if (openMenuKey === key) hideMenus(); else showMenu(key); };
            m.onmouseenter = function () { if (openMenuKey) showMenu(key); };
        });
    }

    function showMenu(key) {
        hideMenus(true); openMenuKey = key;
        var dd = document.querySelector('.dropdown[data-for="' + key + '"]'), m = document.querySelector('.menu[data-menu="' + key + '"]');
        if (dd) dd.classList.add('show'); if (m) m.classList.add('open');
    }
    function hideMenus(keepKey) {
        Array.prototype.forEach.call(document.querySelectorAll('.dropdown'), function (d) { d.classList.remove('show'); });
        Array.prototype.forEach.call(document.querySelectorAll('.menu'), function (m) { m.classList.remove('open'); });
        if (!keepKey) openMenuKey = null;
    }
    document.addEventListener('click', function () { hideMenus(); });

    $('btnPlay').addEventListener('click', play);
    $('btnPause').addEventListener('click', pause);
    $('btnStop').addEventListener('click', stop);
    $('btnNext').addEventListener('click', next);
    $('btnPrev').addEventListener('click', prev);
    $('btnEject').addEventListener('click', openFile);

    window.setGlobalVolume = function (val) { volLevel = Math.max(0, Math.min(100, Number(val) || 0)); applyVolume(); };
    window.setMute = function (m) { audio.muted = !!m; };

    buildMenus(); sizeCanvas(); drawVisualizer(); applyVolume(); applyBalance();
    loadTrack(0); renderPlaylist();
})();
</script>
</body>
</html>
