<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adsız - Not Defteri</title>
<style>
/* ============================================================
   GENEL / TEMEL
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Tahoma, "Segoe UI", sans-serif;
    font-size: 11px;
    color: #000;
    background: #ECE9D8;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
}

/* ============================================================
   MENÜ ÇUBUĞU (XP Luna)
   ============================================================ */
.menubar {
    flex: 0 0 auto;
    display: flex;
    align-items: stretch;
    height: 20px;
    background: #ECE9D8;
    border-bottom: 1px solid #ACA899;
    position: relative;
    z-index: 100;
    padding-left: 1px;
}

.menu-title {
    position: relative;
    display: flex;
    align-items: center;
    padding: 0 8px;
    font-size: 11px;
    color: #000;
    cursor: default;
    white-space: nowrap;
}

.menu-title:hover,
.menu-title.open {
    background: #316AC5;
    color: #fff;
}

/* Açılır menü kutusu */
.dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    min-width: 186px;
    background: #FFFFFF;
    border: 1px solid #ACA899;
    box-shadow: 2px 2px 5px rgba(0, 0, 0, .35);
    padding: 2px 0;
    z-index: 200;
    color: #000;
}

.menu-title.open .dropdown { display: block; }

/* Menü öğesi */
.mi {
    display: flex;
    align-items: center;
    height: 20px;
    padding: 0 12px 0 4px;
    font-size: 11px;
    white-space: nowrap;
    cursor: default;
    color: #000;
}

.mi-ck {
    width: 16px;
    text-align: center;
    font-size: 11px;
    flex: 0 0 16px;
}

.mi-lbl { flex: 1 1 auto; }

.mi-key {
    margin-left: 26px;
    opacity: .85;
    font-size: 11px;
}

.mi:hover { background: #316AC5; color: #fff; }

.mi.disabled { color: #ACA899; }
.mi.disabled:hover { background: transparent; color: #ACA899; }

.mi-sep {
    height: 1px;
    background: #ACA899;
    margin: 3px 2px;
}

/* ============================================================
   DÜZENLEME ALANI
   ============================================================ */
.editor {
    flex: 1 1 auto;
    display: flex;
    background: #FFFFFF;
    overflow: hidden;
    position: relative;
}

#txt {
    flex: 1 1 auto;
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    resize: none;
    padding: 3px 4px;
    font-family: "Lucida Console", "Courier New", monospace;
    font-size: 13px;
    line-height: 1.35;
    color: #000;
    background: #FFFFFF;
    overflow: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
    user-select: text;
    -webkit-user-select: text;
    cursor: text;
}

/* Sözcük kaydırma kapalıyken */
#txt.nowrap {
    white-space: pre;
    word-wrap: normal;
    overflow-x: auto;
    overflow-y: auto;
}

/* ============================================================
   DURUM ÇUBUĞU
   ============================================================ */
.statusbar {
    flex: 0 0 auto;
    height: 20px;
    background: #ECE9D8;
    border-top: 1px solid #ACA899;
    display: flex;
    align-items: center;
    padding: 0 2px;
    gap: 2px;
    font-size: 11px;
    color: #000;
}

.statusbar.hidden { display: none; }

.sb-panel {
    height: 16px;
    display: flex;
    align-items: center;
    padding: 0 6px;
    border: 1px solid;
    border-color: #ACA899 #FFFFFF #FFFFFF #ACA899;
    background: #ECE9D8;
    white-space: nowrap;
}

.sb-grow { flex: 1 1 auto; }

/* ============================================================
   XP DÜĞMELERİ / GİRDİLERİ
   ============================================================ */
.xp-btn {
    min-width: 74px;
    height: 22px;
    padding: 0 12px;
    font-family: Tahoma, sans-serif;
    font-size: 11px;
    color: #000;
    background: linear-gradient(to bottom, #FDFDFD 0%, #F2F0E8 45%, #E4E1D3 46%, #ECE9D8 100%);
    border: 1px solid #7F9DB9;
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px #FFFFFF;
    cursor: default;
    outline: none;
}

.xp-btn:hover {
    border-color: #3C7FB1;
    background: linear-gradient(to bottom, #FFFDF4 0%, #F8F2DC 45%, #EFE2BD 46%, #F5EBCB 100%);
}

.xp-btn:active {
    background: #DDD8C8;
    border-color: #3C7FB1;
    box-shadow: inset 1px 1px 2px rgba(0, 0, 0, .28);
}

.xp-btn.default {
    border-color: #3C7FB1;
    box-shadow: inset 0 0 0 1px #FFFFFF, 0 0 0 1px #3C7FB1;
}

.xp-input,
.xp-select {
    font-family: Tahoma, sans-serif;
    font-size: 11px;
    color: #000;
    background: #FFFFFF;
    border: 1px solid #7F9DB9;
    padding: 2px 3px;
    outline: none;
}

.xp-input:focus,
.xp-select:focus { border-color: #316AC5; }

/* ============================================================
   MODAL PENCERE (XP Diyalog)
   ============================================================ */
.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .18);
    z-index: 900;
    align-items: center;
    justify-content: center;
}

.dlg {
    background: #ECE9D8;
    border: 1px solid #0A246A;
    border-radius: 6px 6px 0 0;
    box-shadow: 3px 3px 12px rgba(0, 0, 0, .45);
    padding: 3px;
    min-width: 260px;
    max-width: 92%;
}

.dlg-titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 24px;
    padding: 0 4px 0 8px;
    border-radius: 4px 4px 0 0;
    background: linear-gradient(to bottom,
        #0058EE 0%, #3A93FF 8%, #288EFF 40%,
        #0054E3 88%, #0046CA 100%);
    color: #FFFFFF;
    font-size: 11px;
    font-weight: bold;
    text-shadow: 1px 1px 1px rgba(0, 0, 0, .45);
}

.dlg-close {
    width: 21px;
    height: 19px;
    padding: 0;
    font-family: Tahoma, sans-serif;
    font-size: 9px;
    font-weight: bold;
    line-height: 1;
    color: #FFFFFF;
    border: 1px solid #FFFFFF;
    border-radius: 3px;
    background: linear-gradient(to bottom, #F09A7C 0%, #D4451B 45%, #B93408 100%);
    cursor: default;
    outline: none;
}

.dlg-close:hover { background: linear-gradient(to bottom, #FFB79B 0%, #E2552A 45%, #C93E10 100%); }
.dlg-close:active { background: #A82E06; border-style: inset; }

.dlg-body {
    padding: 12px 14px;
    font-size: 11px;
    color: #000;
    background: #ECE9D8;
    user-select: text;
    -webkit-user-select: text;
}

.dlg-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 7px;
    padding: 0 14px 12px;
    background: #ECE9D8;
}

/* Yazı tipi diyalogu */
.fd-row {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
}

.fd-row label {
    width: 72px;
    flex: 0 0 72px;
    font-size: 11px;
}

.fd-row select {
    flex: 1 1 auto;
    height: 20px;
}

.fd-preview {
    margin-top: 10px;
    height: 58px;
    border: 1px solid #7F9DB9;
    background: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    overflow: hidden;
    white-space: nowrap;
}

/* ============================================================
   XP KAYDIRMA ÇUBUĞU
   ============================================================ */
::-webkit-scrollbar { width: 16px; height: 16px; }
::-webkit-scrollbar-track { background: #F1F1F1; }
::-webkit-scrollbar-thumb {
    background: linear-gradient(to right, #E4EEFB 0%, #C6D8F5 45%, #A8C4F0 100%);
    border: 1px solid #7A96DF;
    border-radius: 2px;
}
::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(to right, #F0F6FF 0%, #BBD3F8 45%, #9BBDF3 100%);
}
::-webkit-scrollbar-corner { background: #F1F1F1; }
</style>
</head>
<body>

<div class="menubar" id="menubar"></div>

<div class="editor">
    <textarea id="txt" spellcheck="false" wrap="soft"></textarea>
</div>

<div class="statusbar" id="statusbar">
    <div class="sb-panel sb-grow"></div>
    <div class="sb-panel" id="posInfo">Satır 1, Sütun 1</div>
</div>

<input type="file" id="fileInput" accept=".txt,text/plain" style="display:none">

<div class="overlay" id="overlay"></div>

<script>
/* ============================================================
   SABİTLER
   ============================================================ */
var NOTEPAD_ICON = 'https://win98icons.alexmeub.com/icons/png/notepad-2.png';

var ta         = document.getElementById('txt');
var menubar    = document.getElementById('menubar');
var overlay    = document.getElementById('overlay');
var statusbar  = document.getElementById('statusbar');
var fileInput  = document.getElementById('fileInput');

var fileName     = 'Adsız.txt';
var wordWrap     = true;
var statusVisible = true;
var openMenuEl   = null;
var checkRefs    = {};

/* ============================================================
   MENÜ TANIMLARI
   ============================================================ */
var MENUS = [
    {
        label: 'Dosya',
        items: [
            { label: 'Yeni',                 key: 'Ctrl+N',       action: 'new' },
            { label: 'Aç...',                key: 'Ctrl+O',       action: 'open' },
            { label: 'Kaydet',               key: 'Ctrl+S',       action: 'save' },
            { label: 'Farklı Kaydet...',     key: 'Ctrl+Shift+S', action: 'saveAs' },
            { sep: true },
            { label: 'Yazdır...',            key: 'Ctrl+P',       action: 'print' },
            { sep: true },
            { label: 'Çıkış',                key: 'Alt+F4',       action: 'exit' }
        ]
    },
    {
        label: 'Düzen',
        items: [
            { label: 'Geri Al',              key: 'Ctrl+Z',       action: 'undo' },
            { sep: true },
            { label: 'Kes',                  key: 'Ctrl+X',       action: 'cut' },
            { label: 'Kopyala',              key: 'Ctrl+C',       action: 'copy' },
            { label: 'Yapıştır',             key: 'Ctrl+V',       action: 'paste' },
            { label: 'Sil',                  key: 'Del',          action: 'delete' },
            { sep: true },
            { label: 'Tümünü Seç',           key: 'Ctrl+A',       action: 'selectAll' },
            { label: 'Saat/Tarih',           key: 'F5',           action: 'timeDate' }
        ]
    },
    {
        label: 'Biçim',
        items: [
            { label: 'Sözcük Kaydır',                             action: 'toggleWrap', check: true },
            { label: 'Yazı Tipi...',                              action: 'font' }
        ]
    },
    {
        label: 'Görünüm',
        items: [
            { label: 'Durum Çubuğu',                              action: 'toggleStatus', check: true }
        ]
    },
    {
        label: 'Yardım',
        items: [
            { label: 'Not Defteri Hakkında',                      action: 'about' }
        ]
    }
];

/* ============================================================
   MENÜ OLUŞTURMA
   ============================================================ */
function buildMenus() {
    MENUS.forEach(function (menu) {
        var title = document.createElement('div');
        title.className = 'menu-title';
        title.appendChild(document.createTextNode(menu.label));

        var dd = document.createElement('div');
        dd.className = 'dropdown';

        menu.items.forEach(function (it) {
            if (it.sep) {
                var sep = document.createElement('div');
                sep.className = 'mi-sep';
                dd.appendChild(sep);
                return;
            }

            var el  = document.createElement('div');
            el.className = 'mi' + (it.disabled ? ' disabled' : '');

            var ck  = document.createElement('span');
            ck.className = 'mi-ck';

            var lbl = document.createElement('span');
            lbl.className = 'mi-lbl';
            lbl.textContent = it.label;

            var key = document.createElement('span');
            key.className = 'mi-key';
            key.textContent = it.key || '';

            el.appendChild(ck);
            el.appendChild(lbl);
            el.appendChild(key);

            if (it.check) checkRefs[it.action] = ck;

            el.addEventListener('click', function (e) {
                e.stopPropagation();
                if (it.disabled) return;
                closeAllMenus();
                runAction(it.action);
            });

            dd.appendChild(el);
        });

        title.appendChild(dd);

        title.addEventListener('click', function (e) {
            e.stopPropagation();
            if (openMenuEl === title) closeAllMenus();
            else openMenu(title);
        });

        title.addEventListener('mouseenter', function () {
            if (openMenuEl && openMenuEl !== title) openMenu(title);
        });

        menubar.appendChild(title);
    });
}

function openMenu(titleEl) {
    closeAllMenus();
    titleEl.classList.add('open');
    openMenuEl = titleEl;
}

function closeAllMenus() {
    var list = menubar.querySelectorAll('.menu-title.open');
    for (var i = 0; i < list.length; i++) list[i].classList.remove('open');
    openMenuEl = null;
}

document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('.dropdown')) return;
    if (e.target.closest && e.target.closest('.menu-title')) return;
    closeAllMenus();
});

/* ============================================================
   ONAY İŞARETLERİ
   ============================================================ */
function refreshChecks() {
    if (checkRefs.toggleWrap)   checkRefs.toggleWrap.textContent   = wordWrap ? '✓' : '';
    if (checkRefs.toggleStatus) checkRefs.toggleStatus.textContent = statusVisible ? '✓' : '';
}

/* ============================================================
   MODAL DİYALOG ALTYAPISI
   ============================================================ */
function closeDialog() {
    overlay.style.display = 'none';
    overlay.innerHTML = '';
    if (ta) ta.focus();
}

function openDialog(cfg) {
    overlay.innerHTML = '';

    var dlg = document.createElement('div');
    dlg.className = 'dlg';
    dlg.style.width = (cfg.width || 320) + 'px';

    var tb = document.createElement('div');
    tb.className = 'dlg-titlebar';

    var tbText = document.createElement('span');
    tbText.textContent = cfg.title || '';

    var tbClose = document.createElement('button');
    tbClose.type = 'button';
    tbClose.className = 'dlg-close';
    tbClose.textContent = '✕';
    tbClose.addEventListener('click', closeDialog);

    tb.appendChild(tbText);
    tb.appendChild(tbClose);
    dlg.appendChild(tb);

    var body = document.createElement('div');
    body.className = 'dlg-body';
    if (typeof cfg.body === 'string') body.innerHTML = cfg.body;
    else if (cfg.body) body.appendChild(cfg.body);
    dlg.appendChild(body);

    var btnWrap = document.createElement('div');
    btnWrap.className = 'dlg-buttons';

    (cfg.buttons || [{ label: 'Tamam' }]).forEach(function (b) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'xp-btn' + (b.default ? ' default' : '');
        btn.textContent = b.label;
        btn.addEventListener('click', function () {
            var keepOpen = false;
            if (b.onClick) keepOpen = (b.onClick() === false);
            if (!keepOpen) closeDialog();
        });
        btnWrap.appendChild(btn);
    });

    dlg.appendChild(btnWrap);
    overlay.appendChild(dlg);
    overlay.style.display = 'flex';

    return { dlg: dlg, body: body };
}

/* ============================================================
   DURUM ÇUBUĞU
   ============================================================ */
function updateStatus() {
    var before = ta.value.substring(0, ta.selectionStart);
    var lines  = before.split('\n');
    var line   = lines.length;
    var col    = lines[lines.length - 1].length + 1;
    document.getElementById('posInfo').textContent = 'Satır ' + line + ', Sütun ' + col;
}

ta.addEventListener('input', updateStatus);
ta.addEventListener('keyup', updateStatus);
ta.addEventListener('click', updateStatus);
ta.addEventListener('mouseup', updateStatus);

/* ============================================================
   DOSYA İŞLEMLERİ
   ============================================================ */
function doNew() {
    if (ta.value.length > 0) {
        openDialog({
            title: 'Not Defteri',
            width: 340,
            body: '<div style="display:flex; gap:12px; align-items:center;">' +
                  '<span style="font-size:24px;">❓</span>' +
                  '<div>Mevcut içerik silinecek. Devam etmek istiyor musunuz?</div>' +
                  '</div>',
            buttons: [
                {
                    label: 'Evet',
                    default: true,
                    onClick: function () {
                        ta.value = '';
                        fileName = 'Adsız.txt';
                        updateStatus();
                        ta.focus();
                    }
                },
                { label: 'İptal' }
            ]
        });
        return;
    }
    ta.value = '';
    fileName = 'Adsız.txt';
    updateStatus();
    ta.focus();
}

function doOpen() {
    fileInput.click();
}

fileInput.addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;

    var reader = new FileReader();
    reader.onload = function (ev) {
        ta.value = ev.target.result;
        fileName = f.name;
        updateStatus();
    };
    reader.readAsText(f, 'UTF-8');
    this.value = '';
});

function downloadFile(name) {
    var blob = new Blob([ta.value], { type: 'text/plain;charset=utf-8' });
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = url;
    a.download = name || 'Adsız.txt';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }, 120);
}

function doSave() {
    if (!fileName || fileName === 'Adsız.txt') {
        doSaveAs();
        return;
    }
    downloadFile(fileName);
}

function doSaveAs() {
    var wrapEl = document.createElement('div');
    wrapEl.innerHTML =
        '<div style="margin-bottom:6px;">Dosya adı:</div>' +
        '<input type="text" class="xp-input" id="saName" style="width:100%;" value="' +
        (fileName || 'Adsız.txt').replace(/"/g, '&quot;') + '">' +
        '<div style="margin-top:10px; color:#555;">Kayıt türü: Metin Belgeleri (*.txt)</div>';

    var d = openDialog({
        title: 'Farklı Kaydet',
        width: 360,
        body: wrapEl,
        buttons: [
            {
                label: 'Kaydet',
                default: true,
                onClick: function () {
                    var inp = wrapEl.querySelector('#saName');
                    var val = (inp.value || '').trim();
                    if (!val) {
                        openDialog({
                            title: 'Farklı Kaydet',
                            width: 280,
                            body: 'Lütfen bir dosya adı girin.',
                            buttons: [{ label: 'Tamam', default: true }]
                        });
                        return false;
                    }
                    if (!/\.txt$/i.test(val)) val += '.txt';
                    fileName = val;
                    downloadFile(fileName);
                }
            },
            { label: 'İptal' }
        ]
    });

    var inp = d.body.querySelector('#saName');
    if (inp) {
        inp.focus();
        inp.select();
        inp.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                var btns = d.dlg.querySelectorAll('.dlg-buttons .xp-btn');
                if (btns[0]) btns[0].click();
            }
        });
    }
}

function doExit() {
    if (ta.value.length > 0) {
        openDialog({
            title: 'Not Defteri',
            width: 340,
            body: '<div style="display:flex; gap:12px; align-items:center;">' +
                  '<span style="font-size:24px;">⚠️</span>' +
                  '<div>Kaydedilmemiş değişiklikler var. Yine de çıkılsın mı?</div>' +
                  '</div>',
            buttons: [
                {
                    label: 'Evet',
                    default: true,
                    onClick: function () {
                        try {
                            if (window.parent && window.parent.windowManager) {
                                window.parent.windowManager.close('notepad');
                            } else {
                                window.parent.postMessage({ type: 'xp-app-close', app: 'notepad' }, '*');
                            }
                        } catch (e) {}
                        window.close();
                    }
                },
                { label: 'İptal' }
            ]
        });
        return;
    }
    try {
        if (window.parent && window.parent.windowManager) {
            window.parent.windowManager.close('notepad');
        } else {
            window.parent.postMessage({ type: 'xp-app-close', app: 'notepad' }, '*');
        }
    } catch (e) {}
    window.close();
}

/* ============================================================
   DÜZEN İŞLEMLERİ
   ============================================================ */
function insertAtCursor(str) {
    ta.focus();
    var ok = false;
    try { ok = document.execCommand('insertText', false, str); } catch (e) { ok = false; }

    if (!ok) {
        var s = ta.selectionStart;
        var e = ta.selectionEnd;
        ta.value = ta.value.substring(0, s) + str + ta.value.substring(e);
        ta.selectionStart = ta.selectionEnd = s + str.length;
    }
    updateStatus();
}

function doTimeDate() {
    var now = new Date();
    var t = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
    var d = now.toLocaleDateString('tr-TR');
    insertAtCursor(t + ' ' + d);
}

function execCmd(cmd) {
    ta.focus();
    try { document.execCommand(cmd); } catch (e) { /* yoksay */ }
    updateStatus();
}

function doPaste() {
    ta.focus();
    var ok = false;
    try { ok = document.execCommand('paste'); } catch (e) { ok = false; }

    if (!ok && navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(function (txt) {
            if (txt) insertAtCursor(txt);
        }).catch(function () {
            openDialog({
                title: 'Not Defteri',
                width: 320,
                body: 'Panodan yapıştırma bu tarayıcıda engellenmiş.',
                buttons: [{ label: 'Tamam', default: true }]
            });
        });
    }
}

/* ============================================================
   GÖRÜNÜM İŞLEMLERİ
   ============================================================ */
function setWordWrap(on) {
    wordWrap = on;
    if (on) {
        ta.wrap = 'soft';
        ta.classList.remove('nowrap');
    } else {
        ta.wrap = 'off';
        ta.classList.add('nowrap');
    }
    refreshChecks();
    updateStatus();
}

function setStatusBar(on) {
    statusVisible = on;
    statusbar.classList.toggle('hidden', !on);
    refreshChecks();
}

/* ============================================================
   YAZI TİPİ DİYALOGU
   ============================================================ */
var FONT_FAMILIES = [
    'Lucida Console', 'Courier New', 'Fixedsys', 'Consolas',
    'Tahoma', 'Verdana', 'Arial', 'Times New Roman', 'Comic Sans MS'
];
var FONT_SIZES = [8, 9, 10, 11, 12, 13, 14, 16, 18, 20, 24, 28, 36];
var FONT_STYLES = ['Normal', 'Kalın', 'İtalik', 'Kalın İtalik'];

function doFont() {
    var wrapEl = document.createElement('div');
    wrapEl.className = 'font-dlg';
    wrapEl.innerHTML =
        '<div class="fd-row"><label>Yazı Tipi:</label>' +
        '<select class="xp-select" id="fdFamily">' +
        FONT_FAMILIES.map(function (f) { return '<option>' + f + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="fd-row"><label>Stil:</label>' +
        '<select class="xp-select" id="fdStyle">' +
        FONT_STYLES.map(function (s) { return '<option>' + s + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="fd-row"><label>Boyut:</label>' +
        '<select class="xp-select" id="fdSize">' +
        FONT_SIZES.map(function (s) { return '<option>' + s + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="fd-preview" id="fdPreview">AaBbYyZz</div>';

    var d = openDialog({
        title: 'Yazı Tipi',
        width: 400,
        body: wrapEl,
        buttons: [
            {
                label: 'Tamam',
                default: true,
                onClick: function () {
                    var fam = wrapEl.querySelector('#fdFamily').value;
                    var sty = wrapEl.querySelector('#fdStyle').value;
                    var siz = parseInt(wrapEl.querySelector('#fdSize').value, 10) || 13;

                    ta.style.fontFamily = '"' + fam + '", monospace';
                    ta.style.fontSize   = siz + 'px';
                    ta.style.fontWeight = (sty === 'Kalın' || sty === 'Kalın İtalik') ? 'bold' : 'normal';
                    ta.style.fontStyle  = (sty === 'İtalik' || sty === 'Kalın İtalik') ? 'italic' : 'normal';
                    ta.focus();
                }
            },
            { label: 'İptal' }
        ]
    });

    var selFam = wrapEl.querySelector('#fdFamily');
    var selSty = wrapEl.querySelector('#fdStyle');
    var selSiz = wrapEl.querySelector('#fdSize');
    var prev   = wrapEl.querySelector('#fdPreview');

    var curFam = (ta.style.fontFamily || 'Lucida Console').replace(/["']/g, '').split(',')[0].trim();
    if (FONT_FAMILIES.indexOf(curFam) !== -1) selFam.value = curFam;

    var curSiz = parseInt(ta.style.fontSize, 10) || 13;
    if (FONT_SIZES.indexOf(curSiz) !== -1) selSiz.value = String(curSiz);

    if (ta.style.fontWeight === 'bold' && ta.style.fontStyle === 'italic') selSty.value = 'Kalın İtalik';
    else if (ta.style.fontWeight === 'bold') selSty.value = 'Kalın';
    else if (ta.style.fontStyle === 'italic') selSty.value = 'İtalik';
    else selSty.value = 'Normal';

    function updatePreview() {
        prev.style.fontFamily = '"' + selFam.value + '", monospace';
        prev.style.fontSize   = selSiz.value + 'px';
        prev.style.fontWeight = (selSty.value === 'Kalın' || selSty.value === 'Kalın İtalik') ? 'bold' : 'normal';
        prev.style.fontStyle  = (selSty.value === 'İtalik' || selSty.value === 'Kalın İtalik') ? 'italic' : 'normal';
    }

    selFam.addEventListener('change', updatePreview);
    selSty.addEventListener('change', updatePreview);
    selSiz.addEventListener('change', updatePreview);
    updatePreview();
}

/* ============================================================
   HAKKINDA DİYALOGU
   ============================================================ */
function doAbout() {
    var html =
        '<div style="display:flex; gap:14px; align-items:flex-start;">' +
            '<img src="' + NOTEPAD_ICON + '" width="32" height="32" alt="Not Defteri" ' +
                 'style="flex:0 0 32px;" onerror="this.style.visibility=\'hidden\'">' +
            '<div style="line-height:1.6;">' +
                '<div style="font-weight:bold; font-size:12px; margin-bottom:4px;">Not Defteri</div>' +
                '<div>Microsoft Windows XP Professional</div>' +
                '<div>Sürüm 5.1 (Build 2600.xpsp_sp3_gdr)</div>' +
                '<div style="margin-top:10px;">Telif Hakkı © 1981-2001 Microsoft Corporation</div>' +
                '<div style="margin-top:10px; color:#444;">' +
                    'Bu simülasyon Muhammed Can Ceylan portföyü için hazırlanmıştır.' +
                '</div>' +
            '</div>' +
        '</div>';

    openDialog({
        title: 'Not Defteri Hakkında',
        width: 420,
        body: html,
        buttons: [{ label: 'Tamam', default: true }]
    });
}

/* ============================================================
   AKSİYON YÖNLENDİRİCİ
   ============================================================ */
function runAction(action) {
    switch (action) {
        case 'new':          doNew(); break;
        case 'open':         doOpen(); break;
        case 'save':         doSave(); break;
        case 'saveAs':       doSaveAs(); break;
        case 'print':        window.print(); break;
        case 'exit':         doExit(); break;

        case 'undo':         execCmd('undo'); break;
        case 'cut':          execCmd('cut'); break;
        case 'copy':         execCmd('copy'); break;
        case 'paste':        doPaste(); break;
        case 'delete':       execCmd('delete'); break;
        case 'selectAll':    ta.focus(); ta.select(); updateStatus(); break;
        case 'timeDate':     doTimeDate(); break;

        case 'toggleWrap':   setWordWrap(!wordWrap); break;
        case 'font':         doFont(); break;

        case 'toggleStatus': setStatusBar(!statusVisible); break;

        case 'about':        doAbout(); break;
    }
}

/* ============================================================
   KLAVYE KISAYOLLARI
   ============================================================ */
document.addEventListener('keydown', function (e) {
    var key  = e.key || '';
    var low  = key.toLowerCase();
    var ctrl = e.ctrlKey || e.metaKey;

    if (overlay.style.display === 'flex') {
        if (key === 'Escape') { e.preventDefault(); closeDialog(); }
        return;
    }

    if (key === 'Escape') { closeAllMenus(); return; }
    if (key === 'F5')     { e.preventDefault(); doTimeDate(); return; }

    if (ctrl && e.shiftKey && low === 's') { e.preventDefault(); doSaveAs(); return; }
    if (!ctrl || e.shiftKey) return;

    switch (low) {
        case 'n': e.preventDefault(); doNew(); break;
        case 'o': e.preventDefault(); doOpen(); break;
        case 's': e.preventDefault(); doSave(); break;
        case 'p': e.preventDefault(); window.print(); break;
        case 'a': e.preventDefault(); ta.focus(); ta.select(); updateStatus(); break;
    }
});

/* ============================================================
   BAŞLATMA
   ============================================================ */
(function init() {
    buildMenus();
    refreshChecks();
    setWordWrap(true);
    setStatusBar(true);
    updateStatus();
    ta.focus();
})();
</script>
</body>
