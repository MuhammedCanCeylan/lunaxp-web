<script>

(() => {

"use strict";

/* =========================================================
   CONSTANTS
   ========================================================= */

const SECTOR_SIZE = 2048;

const DISC_TYPES = {

    cd: {
        label: "CD-ROM (ISO)",
        medium: "CD-R 700 MB",
        capacity: 700 * 1024 * 1024
    },

    dvd: {
        label: "DVD-ROM (ISO)",
        medium: "DVD-R 4.7 GB",
        capacity: 4700 * 1000 * 1000
    },

    dvddl: {
        label: "DVD-ROM DL (ISO)",
        medium: "DVD+R DL 8.5 GB",
        capacity: 8500 * 1000 * 1000
    }

};

/* =========================================================
   STATE
   ========================================================= */

const state = {

    files: [],

    selected:
        new Set(),

    discType:
        "cd",

    volumeName:
        "NEW",

    compilationName:
        "New Compilation"

};

/* =========================================================
   ELEMENTS
   ========================================================= */

const fileInput =
    document.getElementById(
        "fileInput"
    );

const fileList =
    document.getElementById(
        "fileList"
    );

const emptyList =
    document.getElementById(
        "emptyList"
    );

const capacityFill =
    document.getElementById(
        "capacityFill"
    );

const capacityValues =
    document.getElementById(
        "capacityValues"
    );

const capacityName =
    document.getElementById(
        "capacityName"
    );

const statusMain =
    document.getElementById(
        "statusMain"
    );

const statusFiles =
    document.getElementById(
        "statusFiles"
    );

const statusSize =
    document.getElementById(
        "statusSize"
    );

const compilationName =
    document.getElementById(
        "compilationName"
    );

const treeDiscName =
    document.getElementById(
        "treeDiscName"
    );

const discTypeLabel =
    document.getElementById(
        "discTypeLabel"
    );

const dialogOverlay =
    document.getElementById(
        "dialogOverlay"
    );

const dialogTitle =
    document.getElementById(
        "dialogTitle"
    );

const dialogBody =
    document.getElementById(
        "dialogBody"
    );

const dialogButtons =
    document.getElementById(
        "dialogButtons"
    );

/* =========================================================
   UTILITIES
   ========================================================= */

function humanSize(bytes) {

    if (bytes < 1024) {
        return bytes + " B";
    }

    if (bytes < 1024 * 1024) {
        return (
            bytes / 1024
        ).toFixed(1) + " KB";
    }

    if (bytes < 1024 * 1024 * 1024) {
        return (
            bytes /
            (1024 * 1024)
        ).toFixed(1) + " MB";
    }

    return (
        bytes /
        (
            1024 *
            1024 *
            1024
        )
    ).toFixed(2) + " GB";

}


function totalSize() {

    return state.files.reduce(
        (sum, item) =>
            sum + item.file.size,
        0
    );

}


function fileType(file) {

    const name =
        file.name;

    const dot =
        name.lastIndexOf(".");

    if (dot === -1) {
        return "File";
    }

    return (
        name
            .slice(dot + 1)
            .toUpperCase()
        +
        " File"
    );

}


function setStatus(text) {

    statusMain.textContent =
        text;

}


function escapeHTML(value) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(value);

    return div.innerHTML;

}


function downloadBlob(
    blob,
    filename
) {

    const url =
        URL.createObjectURL(blob);

    const anchor =
        document.createElement(
            "a"
        );

    anchor.href =
        url;

    anchor.download =
        filename;

    anchor.click();

    setTimeout(
        () => URL.revokeObjectURL(url),
        1500
    );

}

/* =========================================================
   DIALOG SYSTEM
   ========================================================= */

function showDialog(
    title,
    html,
    buttons = [
        {
            text: "OK",
            click: closeDialog
        }
    ]
) {

    dialogTitle.textContent =
        title;

    dialogBody.innerHTML =
        html;

    dialogButtons.innerHTML =
        "";

    buttons.forEach(config => {

        const button =
            document.createElement(
                "button"
            );

        button.textContent =
            config.text;

        button.addEventListener(
            "click",
            config.click
        );

        dialogButtons.appendChild(
            button
        );

    });

    dialogOverlay.classList.add(
        "active"
    );

}


function closeDialog() {

    dialogOverlay.classList.remove(
        "active"
    );

}

/* =========================================================
   FILE HANDLING
   ========================================================= */

function addFiles(files) {

    const incoming =
        Array.from(files);

    incoming.forEach(file => {

        if (
            file.size >
            0xFFFFFFFF
        ) {

            showDialog(
                "Nero Burning ROM",
                `
                <b>File too large for this ISO mode.</b>

                <p>
                    ${escapeHTML(file.name)}
                    exceeds the 4 GB ISO 9660 file-size limit
                    used by this virtual recorder.
                </p>
                `
            );

            return;

        }

        state.files.push({
            id:
                crypto.randomUUID
                    ? crypto.randomUUID()
                    : (
                        Date.now() +
                        "-" +
                        Math.random()
                    ),

            file
        });

    });

    renderFiles();

    updateCapacity();

    setStatus(
        incoming.length +
        " file(s) added to compilation."
    );

}


function removeSelected() {

    if (!state.selected.size) {
        return;
    }

    state.files =
        state.files.filter(
            item =>
                !state.selected.has(
                    item.id
                )
        );

    state.selected.clear();

    renderFiles();

    updateCapacity();

    setStatus(
        "Selected files removed."
    );

}


function clearCompilation() {

    state.files = [];

    state.selected.clear();

    renderFiles();

    updateCapacity();

    setStatus(
        "Compilation cleared."
    );

}

/* =========================================================
   RENDER FILES
   ========================================================= */

function renderFiles() {

    fileList
        .querySelectorAll(
            ".file-row"
        )
        .forEach(row =>
            row.remove()
        );

    emptyList.classList.toggle(
        "hidden",
        state.files.length > 0
    );

    state.files.forEach(
        item => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "file-row";

            row.dataset.id =
                item.id;

            if (
                state.selected.has(
                    item.id
                )
            ) {

                row.classList.add(
                    "selected"
                );

            }

            const modified =
                item.file.lastModified
                    ? new Date(
                        item.file.lastModified
                    ).toLocaleString()
                    : "-";

            row.innerHTML = `
                <div class="file-name">
                    <span class="file-mini-icon">
                        📄
                    </span>

                    <span>
                        ${escapeHTML(item.file.name)}
                    </span>
                </div>

                <div>
                    ${humanSize(item.file.size)}
                </div>

                <div>
                    ${escapeHTML(fileType(item.file))}
                </div>

                <div>
                    ${escapeHTML(modified)}
                </div>
            `;

            row.addEventListener(
                "click",
                event => {

                    if (
                        !event.ctrlKey
                    ) {
                        state.selected.clear();
                    }

                    if (
                        state.selected.has(
                            item.id
                        )
                    ) {

                        state.selected.delete(
                            item.id
                        );

                    } else {

                        state.selected.add(
                            item.id
                        );

                    }

                    renderFiles();

                }
            );

            fileList.appendChild(
                row
            );

        }
    );

}

/* =========================================================
   CAPACITY
   ========================================================= */

function updateCapacity() {

    const config =
        DISC_TYPES[
            state.discType
        ];

    const used =
        totalSize();

    const ratio =
        used /
        config.capacity;

    capacityFill.style.width =
        Math.min(
            100,
            ratio * 100
        )
        +
        "%";

    capacityFill.className =
        "capacity-fill";

    if (ratio > 1) {

        capacityFill.classList.add(
            "over"
        );

    } else if (
        ratio > .9
    ) {

        capacityFill.classList.add(
            "warning"
        );

    }

    capacityName.textContent =
        config.medium;

    capacityValues.textContent =
        humanSize(used)
        +
        " / "
        +
        humanSize(
            config.capacity
        );

    statusFiles.textContent =
        state.files.length +
        (
            state.files.length === 1
                ? " file"
                : " files"
        );

    statusSize.textContent =
        humanSize(used);

    discTypeLabel.textContent =
        config.label;

}

/* =========================================================
   ISO 9660 HELPERS
   ========================================================= */

function writeASCII(
    buffer,
    offset,
    length,
    text,
    pad = 0x20
) {

    buffer.fill(
        pad,
        offset,
        offset + length
    );

    const encoded =
        new TextEncoder()
            .encode(
                String(text)
            );

    buffer.set(
        encoded.slice(
            0,
            length
        ),
        offset
    );

}


function writeLE16(
    buffer,
    offset,
    value
) {

    buffer[offset] =
        value & 0xFF;

    buffer[offset + 1] =
        (value >>> 8) & 0xFF;

}


function writeBE16(
    buffer,
    offset,
    value
) {

    buffer[offset] =
        (value >>> 8) & 0xFF;

    buffer[offset + 1] =
        value & 0xFF;

}


function writeBoth16(
    buffer,
    offset,
    value
) {

    writeLE16(
        buffer,
        offset,
        value
    );

    writeBE16(
        buffer,
        offset + 2,
        value
    );

}


function writeLE32(
    buffer,
    offset,
    value
) {

    buffer[offset] =
        value & 0xFF;

    buffer[offset + 1] =
        (value >>> 8) & 0xFF;

    buffer[offset + 2] =
        (value >>> 16) & 0xFF;

    buffer[offset + 3] =
        (value >>> 24) & 0xFF;

}


function writeBE32(
    buffer,
    offset,
    value
) {

    buffer[offset] =
        (value >>> 24) & 0xFF;

    buffer[offset + 1] =
        (value >>> 16) & 0xFF;

    buffer[offset + 2] =
        (value >>> 8) & 0xFF;

    buffer[offset + 3] =
        value & 0xFF;

}


function writeBoth32(
    buffer,
    offset,
    value
) {

    writeLE32(
        buffer,
        offset,
        value
    );

    writeBE32(
        buffer,
        offset + 4,
        value
    );

}


function directoryDate(
    date =
        new Date()
) {

    return new Uint8Array([
        Math.max(
            0,
            Math.min(
                255,
                date.getUTCFullYear() -
                1900
            )
        ),

        date.getUTCMonth() + 1,

        date.getUTCDate(),

        date.getUTCHours(),

        date.getUTCMinutes(),

        date.getUTCSeconds(),

        0
    ]);

}


function volumeDate(
    date =
        new Date()
) {

    const year =
        String(
            date.getUTCFullYear()
        ).padStart(4, "0");

    const month =
        String(
            date.getUTCMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            date.getUTCDate()
        ).padStart(2, "0");

    const hour =
        String(
            date.getUTCHours()
        ).padStart(2, "0");

    const minute =
        String(
            date.getUTCMinutes()
        ).padStart(2, "0");

    const second =
        String(
            date.getUTCSeconds()
        ).padStart(2, "0");

    return (
        year +
        month +
        day +
        hour +
        minute +
        second +
        "00"
    );

}


function sanitizeVolumeName(
    value
) {

    return String(value)
        .toUpperCase()
        .replace(
            /[^A-Z0-9_ ]/g,
            "_"
        )
        .slice(
            0,
            32
        );

}


function splitFileName(
    name
) {

    const dot =
        name.lastIndexOf(".");

    if (
        dot <= 0
    ) {

        return {
            base: name,
            extension: ""
        };

    }

    return {

        base:
            name.slice(
                0,
                dot
            ),

        extension:
            name.slice(
                dot + 1
            )

    };

}


function cleanIsoText(
    value
) {

    return String(value)
        .toUpperCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .replace(
            /[^A-Z0-9_]/g,
            "_"
        );

}


function makeUniqueIsoNames(
    files
) {

    const used =
        new Set();

    return files.map(
        item => {

            const parts =
                splitFileName(
                    item.file.name
                );

            let base =
                cleanIsoText(
                    parts.base
                )
                .slice(
                    0,
                    8
                );

            let extension =
                cleanIsoText(
                    parts.extension
                )
                .slice(
                    0,
                    3
                );

            if (!base) {
                base = "FILE";
            }

            let attempt =
                extension
                    ? (
                        base +
                        "." +
                        extension
                    )
                    : base;

            let index = 1;

            while (
                used.has(
                    attempt
                )
            ) {

                const suffix =
                    "_" +
                    index;

                base =
                    (
                        cleanIsoText(
                            parts.base
                        )
                        .slice(
                            0,
                            Math.max(
                                1,
                                8 -
                                suffix.length
                            )
                        )
                        +
                        suffix
                    )
                    .slice(
                        0,
                        8
                    );

                attempt =
                    extension
                        ? (
                            base +
                            "." +
                            extension
                        )
                        : base;

                index++;

            }

            used.add(
                attempt
            );

            return (
                attempt +
                ";1"
            );

        }
    );

}


function createDirectoryRecord(
    extent,
    size,
    flags,
    identifier,
    date =
        new Date()
) {

    const idBytes =
        identifier instanceof Uint8Array
            ? identifier
            : new TextEncoder()
                .encode(
                    identifier
                );

    const padding =
        idBytes.length % 2 === 0
            ? 1
            : 0;

    const length =
        33 +
        idBytes.length +
        padding;

    const record =
        new Uint8Array(
            length
        );

    record[0] =
        length;

    record[1] =
        0;

    writeBoth32(
        record,
        2,
        extent
    );

    writeBoth32(
        record,
        10,
        size
    );

    record.set(
        directoryDate(
            date
        ),
        18
    );

    record[25] =
        flags;

    record[26] =
        0;

    record[27] =
        0;

    writeBoth16(
        record,
        28,
        1
    );

    record[32] =
        idBytes.length;

    record.set(
        idBytes,
        33
    );

    return record;

}

/* =========================================================
   DIRECTORY SIZE CALCULATION
   ========================================================= */

function directoryPackedSize(
    recordLengths
) {

    let position = 0;

    for (
        const length
        of recordLengths
    ) {

        const offsetInSector =
            position %
            SECTOR_SIZE;

        if (
            offsetInSector +
            length >
            SECTOR_SIZE
        ) {

            position +=
                SECTOR_SIZE -
                offsetInSector;

        }

        position +=
            length;

    }

    return (
        Math.ceil(
            position /
            SECTOR_SIZE
        )
        *
        SECTOR_SIZE
    );

}

/* =========================================================
   ISO CREATOR
   ========================================================= */

function createISOBlob() {

    if (!state.files.length) {

        throw new Error(
            "Compilation is empty."
        );

    }

    const isoNames =
        makeUniqueIsoNames(
            state.files
        );

    const placeholderLengths = [

        34,
        34,

        ...isoNames.map(
            name => {

                const bytes =
                    new TextEncoder()
                        .encode(
                            name
                        );

                return (
                    33 +
                    bytes.length +
                    (
                        bytes.length %
                        2 === 0
                            ? 1
                            : 0
                    )
                );

            }
        )

    ];

    const rootDirBytes =
        directoryPackedSize(
            placeholderLengths
        );

    const rootDirSectors =
        rootDirBytes /
        SECTOR_SIZE;

    const pvdSector =
        16;

    const terminatorSector =
        17;

    const lPathSector =
        18;

    const mPathSector =
        19;

    const rootSector =
        20;

    let nextSector =
        rootSector +
        rootDirSectors;

    const fileLayouts =
        state.files.map(
            (item, index) => {

                const sectors =
                    Math.ceil(
                        item.file.size /
                        SECTOR_SIZE
                    );

                const layout = {

                    item,
                    isoName:
                        isoNames[index],

                    extent:
                        nextSector,

                    sectors,

                    size:
                        item.file.size

                };

                nextSector +=
                    sectors;

                return layout;

            }
        );

    const totalSectors =
        nextSector;

    /* -----------------------------------------------------
       SYSTEM AREA
       ----------------------------------------------------- */

    const systemArea =
        new Uint8Array(
            16 *
            SECTOR_SIZE
        );

    /* -----------------------------------------------------
       PRIMARY VOLUME DESCRIPTOR
       ----------------------------------------------------- */

    const pvd =
        new Uint8Array(
            SECTOR_SIZE
        );

    pvd[0] = 1;

    writeASCII(
        pvd,
        1,
        5,
        "CD001",
        0
    );

    pvd[6] = 1;

    writeASCII(
        pvd,
        8,
        32,
        "NERO WEB IMAGE RECORDER"
    );

    writeASCII(
        pvd,
        40,
        32,
        sanitizeVolumeName(
            state.volumeName
        )
    );

    writeBoth32(
        pvd,
        80,
        totalSectors
    );

    writeBoth16(
        pvd,
        120,
        1
    );

    writeBoth16(
        pvd,
        124,
        1
    );

    writeBoth16(
        pvd,
        128,
        SECTOR_SIZE
    );

    const pathTableSize =
        10;

    writeBoth32(
        pvd,
        132,
        pathTableSize
    );

    writeLE32(
        pvd,
        140,
        lPathSector
    );

    writeLE32(
        pvd,
        144,
        0
    );

    writeBE32(
        pvd,
        148,
        mPathSector
    );

    writeBE32(
        pvd,
        152,
        0
    );

    const rootRecord =
        createDirectoryRecord(
            rootSector,
            rootDirBytes,
            2,
            new Uint8Array([0])
        );

    pvd.set(
        rootRecord,
        156
    );

    writeASCII(
        pvd,
        190,
        128,
        "NERO BURNING ROM WEB EDITION"
    );

    writeASCII(
        pvd,
        318,
        128,
        "NERO IMAGE RECORDER"
    );

    writeASCII(
        pvd,
        446,
        128,
        "NERO BURNING ROM"
    );

    const dateString =
        volumeDate();

    writeASCII(
        pvd,
        813,
        16,
        dateString,
        0x30
    );

    pvd[829] = 0;

    writeASCII(
        pvd,
        830,
        16,
        dateString,
        0x30
    );

    pvd[846] = 0;

    pvd[881] = 1;

    /* -----------------------------------------------------
       TERMINATOR
       ----------------------------------------------------- */

    const terminator =
        new Uint8Array(
            SECTOR_SIZE
        );

    terminator[0] = 255;

    writeASCII(
        terminator,
        1,
        5,
        "CD001",
        0
    );

    terminator[6] = 1;

    /* -----------------------------------------------------
       PATH TABLE LITTLE ENDIAN
       ----------------------------------------------------- */

    const lPath =
        new Uint8Array(
            SECTOR_SIZE
        );

    lPath[0] = 1;
    lPath[1] = 0;

    writeLE32(
        lPath,
        2,
        rootSector
    );

    writeLE16(
        lPath,
        6,
        1
    );

    lPath[8] = 0;
    lPath[9] = 0;

    /* -----------------------------------------------------
       PATH TABLE BIG ENDIAN
       ----------------------------------------------------- */

    const mPath =
        new Uint8Array(
            SECTOR_SIZE
        );

    mPath[0] = 1;
    mPath[1] = 0;

    writeBE32(
        mPath,
        2,
        rootSector
    );

    writeBE16(
        mPath,
        6,
        1
    );

    mPath[8] = 0;
    mPath[9] = 0;

    /* -----------------------------------------------------
       ROOT DIRECTORY
       ----------------------------------------------------- */

    const rootDirectory =
        new Uint8Array(
            rootDirBytes
        );

    const records = [

        createDirectoryRecord(
            rootSector,
            rootDirBytes,
            2,
            new Uint8Array([0])
        ),

        createDirectoryRecord(
            rootSector,
            rootDirBytes,
            2,
            new Uint8Array([1])
        ),

        ...fileLayouts.map(
            layout =>
                createDirectoryRecord(
                    layout.extent,
                    layout.size,
                    0,
                    layout.isoName,
                    new Date(
                        layout
                            .item
                            .file
                            .lastModified
                        ||
                        Date.now()
                    )
                )
        )

    ];

    let dirPosition = 0;

    records.forEach(
        record => {

            const offset =
                dirPosition %
                SECTOR_SIZE;

            if (
                offset +
                record.length >
                SECTOR_SIZE
            ) {

                dirPosition +=
                    SECTOR_SIZE -
                    offset;

            }

            rootDirectory.set(
                record,
                dirPosition
            );

            dirPosition +=
                record.length;

        }
    );

    /* -----------------------------------------------------
       BUILD BLOB WITHOUT READING FULL FILES INTO RAM
       ----------------------------------------------------- */

    const parts = [

        systemArea,
        pvd,
        terminator,
        lPath,
        mPath,
        rootDirectory

    ];

    fileLayouts.forEach(
        layout => {

            parts.push(
                layout.item.file
            );

            const padded =
                layout.sectors *
                SECTOR_SIZE;

            const padding =
                padded -
                layout.size;

            if (
                padding > 0
            ) {

                parts.push(
                    new Uint8Array(
                        padding
                    )
                );

            }

        }
    );

    return new Blob(
        parts,
        {
            type:
                "application/x-iso9660-image"
        }
    );

}

        </div>

        <p>
            Output:
            <b>
                ${escapeHTML(state.volumeName)}.iso
            </b>
        </p>

        <div
            class="burn-progress"
            id="burnProgress"
        >

            <div class="progress-shell">

                <div
                    class="progress-bar"
                    id="burnProgressBar"
                ></div>

            </div>

            <div
                class="progress-text"
                id="burnProgressText"
            >
                Preparing...
            </div>

        </div>
        `,

        [

            {
                text:
                    "Burn",

                click:
                    startBurn
            },

            {
                text:
                    "Cancel",

                click:
                    closeDialog
            }

        ]

    );

}

/* =========================================================
   BURN
   ========================================================= */

function startBurn() {

    const progressArea =
        document.getElementById(
            "burnProgress"
        );

    const bar =
        document.getElementById(
            "burnProgressBar"
        );

    const text =
        document.getElementById(
            "burnProgressText"
        );

    if (
        !progressArea
    ) {
        return;
    }

    Array.from(
        dialogButtons.children
    )
    .forEach(
        button =>
            button.disabled = true
    );

    progressArea.classList.add(
        "active"
    );

    let progress = 0;

    setStatus(
        "Image Recorder preparing ISO image..."
    );

    const timer =
        setInterval(
            () => {

                progress += 10;

                bar.style.width =
                    progress +
                    "%";

                if (
                    progress < 30
                ) {

                    text.textContent =
                        "Caching files...";

                } else if (
                    progress < 55
                ) {

                    text.textContent =
                        "Generating ISO 9660 filesystem...";

                } else if (
                    progress < 80
                ) {

                    text.textContent =
                        "Writing lead-in and file data...";

                } else if (
                    progress < 100
                ) {

                    text.textContent =
                        "Finalizing image...";

                } else {

                    clearInterval(
                        timer
                    );

                    try {

                        text.textContent =
                            "Creating ISO image...";

                        const iso =
                            createISOBlob();

                        const filename =
                            sanitizeVolumeName(
                                state.volumeName
                            )
                            .replace(
                                /\s+/g,
                                "_"
                            )
                            +
                            ".iso";

                        downloadBlob(
                            iso,
                            filename
                        );

                        bar.style.width =
                            "100%";

                        text.textContent =
                            "Burn process completed successfully.";

                        setStatus(
                            "ISO image successfully created."
                        );

                        setTimeout(
                            () => {

                                showDialog(
                                    "Burn Process Completed",
                                    `
                                    <b>
                                        Burn process completed successfully.
                                    </b>

                                    <p>
                                        Image Recorder created:
                                    </p>

                                    <p>
                                        <b>
                                            ${escapeHTML(filename)}
                                        </b>
                                    </p>

                                    <p>
                                        Size:
                                        ${humanSize(iso.size)}
                                    </p>

                                    <p>
                                        This is an actual ISO 9660
                                        data image containing the files
                                        from the compilation.
                                    </p>
                                    `
                                );

                            },
                            350
                        );

                    } catch (
                        error
                    ) {

                        console.error(
                            error
                        );

                        showDialog(
                            "Nero Burning ROM",
                            `
                            <b>
                                Image creation failed.
                            </b>

                            <p>
                                ${escapeHTML(
                                    error.message
                                )}
                            </p>
                            `
                        );

                    }

                }

            },
            100
        );

}

/* =========================================================
   VERIFY
   ========================================================= */

function verifyCompilation() {

    if (
        !state.files.length
    ) {

        showDialog(
            "Verify Compilation",
            "<p>The compilation is empty.</p>"
        );

        return;

    }

    const duplicateNames =
        new Map();

    state.files.forEach(
        item => {

            const key =
                item.file.name
                    .toLowerCase();

            duplicateNames.set(
                key,
                (
                    duplicateNames.get(
                        key
                    )
                    ||
                    0
                )
                +
                1
            );

        }
    );

    const duplicateCount =
        Array.from(
            duplicateNames.values()
        )
        .filter(
            value =>
                value > 1
        )
        .length;

    const tooLarge =
        totalSize() >
        DISC_TYPES[
            state.discType
        ].capacity;

    showDialog(
        "Verify Compilation",

        `
        <b>
            Compilation verification complete.
        </b>

        <p>
            Files:
            ${state.files.length}
        </p>

        <p>
            Total size:
            ${humanSize(totalSize())}
        </p>

        <p>
            Duplicate filenames:
            ${duplicateCount}
        </p>

        <p>
            Capacity:
            ${
                tooLarge
                    ? '<span style="color:#B00000">Exceeded</span>'
                    : '<span style="color:#147520">OK</span>'
            }
        </p>
        `
    );

}

/* =========================================================
   SELECT ALL
   ========================================================= */

function selectAll() {

    state.files.forEach(
        item =>
            state.selected.add(
                item.id
            )
    );

    renderFiles();

}

/* =========================================================
   ACTION DISPATCH
   ========================================================= */

function executeAction(
    action
) {

    switch (
        action
    ) {

        case "new":
            newCompilationDialog();
            break;

        case "add":
            fileInput.click();
            break;

        case "remove":
            removeSelected();
            break;

        case "clear":
            clearCompilation();
            break;

        case "select-all":
            selectAll();
            break;

        case "burn":
            burnDialog();
            break;

        case "save-project":
            saveProject();
            break;

        case "properties":
            propertiesDialog();
            break;

        case "disc-info":
            discInfo();
            break;

        case "choose-recorder":
            recorderInfo();
            break;

        case "iso-info":
            isoInfo();
            break;

        case "verify":
            verifyCompilation();
            break;

        case "about":
            about();
            break;

    }

    closeMenus();

}

/* =========================================================
   MENU
   ========================================================= */

function closeMenus() {

    document
        .querySelectorAll(
            ".menu.open"
        )
        .forEach(
            menu =>
                menu.classList.remove(
                    "open"
                )
        );

}


document
    .querySelectorAll(
        ".menu-button"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    const menu =
                        button.closest(
                            ".menu"
                        );

                    const open =
                        menu.classList.contains(
                            "open"
                        );

                    closeMenus();

                    if (!open) {

                        menu.classList.add(
                            "open"
                        );

                    }

                }
            );

        }
    );


document
    .querySelectorAll(
        "[data-action]"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () =>
                    executeAction(
                        button.dataset.action
                    )
            );

        }
    );


document.addEventListener(
    "click",
    closeMenus
);

/* =========================================================
   INPUT
   ========================================================= */

fileInput.addEventListener(
    "change",
    () => {

        addFiles(
            fileInput.files
        );

        fileInput.value =
            "";

    }
);

/* =========================================================
   DRAG AND DROP
   ========================================================= */

let dragCounter = 0;


fileList.addEventListener(
    "dragenter",
    event => {

        event.preventDefault();

        dragCounter++;

        fileList.classList.add(
            "dragging"
        );

    }
);


fileList.addEventListener(
    "dragover",
    event => {

        event.preventDefault();

    }
);


fileList.addEventListener(
    "dragleave",
    event => {

        event.preventDefault();

        dragCounter--;

        if (
            dragCounter <= 0
        ) {

            dragCounter = 0;

            fileList.classList.remove(
                "dragging"
            );

        }

    }
);


fileList.addEventListener(
    "drop",
    event => {

        event.preventDefault();

        dragCounter = 0;

        fileList.classList.remove(
            "dragging"
        );

        addFiles(
            event.dataTransfer.files
        );

    }
);

/* =========================================================
   DIALOG
   ========================================================= */

dialogOverlay.addEventListener(
    "mousedown",
    event => {

        if (
            event.target ===
            dialogOverlay
        ) {

            closeDialog();

        }

    }
);

/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.ctrlKey &&
            event.key.toLowerCase() ===
            "o"
        ) {

            event.preventDefault();

            fileInput.click();

            return;

        }

        if (
            event.ctrlKey &&
            event.key.toLowerCase() ===
            "a"
        ) {

            event.preventDefault();

            selectAll();

            return;

        }

        if (
            event.key ===
            "Delete"
        ) {

            removeSelected();

        }

        if (
            event.key ===
            "Escape"
        ) {

            closeDialog();

            closeMenus();

        }

        if (
            event.ctrlKey &&
            event.key.toLowerCase() ===
            "b"
        ) {

            event.preventDefault();

            burnDialog();

        }

    }
);

/* =========================================================
   INITIALIZE
   ========================================================= */

renderFiles();

updateCapacity();

setStatus(
    "Ready - Create a data compilation or add files."
);

})();

</script>
