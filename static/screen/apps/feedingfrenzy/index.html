<style id="xp-feedingfrenzy-compat">
html,body{
    width:100% !important;
    height:100% !important;
    margin:0 !important;
    padding:0 !important;
    overflow:hidden !important;
}
body{
    min-width:0 !important;
    min-height:0 !important;
}
.xp-dialog-shade{
    display:none;
    position:fixed;
    inset:0;
    z-index:2147483646;
    background:rgba(0,0,0,.20);
    align-items:center;
    justify-content:center;
    padding:18px;
}
.xp-dialog-shade.show{display:flex}
.xp-dialog{
    width:min(390px,92vw);
    background:#ECE9D8;
    color:#000;
    border:2px outset #fff;

}
.xp-dialog-title{
    min-height:25px;
    display:flex;
    align-items:center;
    padding:3px 7px;
    color:#fff;
    font-weight:bold;
    background:linear-gradient(90deg,#0a246a,#3a6ea5);
}
.xp-dialog-body{padding:12px;white-space:pre-wrap}
.xp-dialog-actions{text-align:right;padding:0 12px 11px}
.xp-dialog-actions button{
    min-width:75px;
    height:25px;
    background:#ECE9D8;
    border:2px outset #fff;
    font:11px Tahoma,sans-serif;
}
.xp-dialog-actions button:active{border-style:inset}
</style>

<script id="xp-feedingfrenzy-dialog-shim">
(function(){
    function ensureDialog(){
        var shade=document.getElementById('xpFeedingFrenzyDialogShade');
        if(shade) return shade;

        shade=document.createElement('div');
        shade.id='xpFeedingFrenzyDialogShade';
        shade.className='xp-dialog-shade';

        shade.innerHTML=
            '<div class="xp-dialog" role="dialog" aria-modal="true">'+
              '<div class="xp-dialog-title">Feeding Frenzy</div>'+
              '<div class="xp-dialog-body" id="xpFeedingFrenzyDialogMessage"></div>'+
              '<div class="xp-dialog-actions">'+
                '<button type="button" id="xpFeedingFrenzyDialogOK">Tamam</button>'+
              '</div>'+
            '</div>';

        document.body.appendChild(shade);

        shade.querySelector('#xpFeedingFrenzyDialogOK').onclick=function(){
            shade.classList.remove('show');
        };

        return shade;
    }

    function showMessage(message){
        var shade=ensureDialog();
        var msg=shade.querySelector('#xpFeedingFrenzyDialogMessage');
        if(msg) msg.textContent=String(message == null ? '' : message);
        shade.classList.add('show');
    }

    window.alert=function(message){
        showMessage(message);
    };

    window.confirm=function(message){
        showMessage(message);
        return false;
    };

    window.prompt=function(message){
        showMessage(message);
        return null;
    };
})();
</script>
