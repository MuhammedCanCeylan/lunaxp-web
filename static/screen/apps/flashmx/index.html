<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macromedia Flash MX</title>
    <style>
        /* XP Luna / Classic Win32 Base Styles */
        :root {
            --ui-bg: #D4D0C8; /* Classic Windows/Macromedia gray */
            --ui-light: #FFFFFF;
            --ui-highlight: #F0F0EE;
            --ui-shadow: #808080;
            --ui-dark-shadow: #404040;
            --stage-bg: #808080;
            --panel-header: #E0DFE3;
            --text-color: #000000;
            --select-bg: #0A246A;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Tahoma, "Microsoft Sans Serif", sans-serif;
            font-size: 11px;
            background-color: var(--ui-bg);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Menu Bar */
        .menu-bar {
            display: flex;
            background-color: var(--ui-bg);
            padding: 2px 0;
            border-bottom: 1px solid var(--ui-shadow);
        }

        .menu-item {
            padding: 2px 6px;
            cursor: default;
        }

        .menu-item:hover {
            background-color: var(--select-bg);
            color: var(--ui-light);
        }

        .menu-item u {
            text-decoration: none;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            background-color: var(--ui-bg);
            padding: 3px;
            border-bottom: 1px solid var(--ui-shadow);
            border-top: 1px solid var(--ui-light);
        }

        .toolbar-divider {
            width: 2px;
            height: 18px;
            background-color: var(--ui-shadow);
            border-right: 1px solid var(--ui-light);
            margin: 0 4px;
        }

        /* Main Workspace Layout */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Tools Panel (Left) */
        .tools-panel {
            width: 56px;
            background-color: var(--ui-bg);
            border-right: 1px solid var(--ui-shadow);
            border-top: 1px solid var(--ui-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2px;
        }

        .tools-header {
            width: 100%;
            background-color: #000080;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px;
            margin-bottom: 4px;
            text-align: center;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            width: 100%;
        }

        .tool-btn {
            width: 24px;
            height: 24px;
            background-color: var(--ui-bg);
            border: 1px solid var(--ui-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 12px;
        }

        .tool-btn:hover {
            border-top: 1px solid var(--ui-light);
            border-left: 1px solid var(--ui-light);
            border-bottom: 1px solid var(--ui-shadow);
            border-right: 1px solid var(--ui-shadow);
        }

        .tool-btn.active {
            background-color: #E4E3EB;
            border-top: 1px solid var(--ui-dark-shadow);
            border-left: 1px solid var(--ui-dark-shadow);
            border-bottom: 1px solid var(--ui-light);
            border-right: 1px solid var(--ui-light);
        }

        .colors-section {
            width: 100%;
            margin-top: 10px;
            border-top: 1px solid var(--ui-shadow);
            padding-top: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 5px;
            width: 100%;
            padding-left: 5px;
        }

        .color-label {
            font-size: 10px;
        }

        input[type="color"] {
            width: 16px;
            height: 16px;
            padding: 0;
            border: 1px inset var(--ui-shadow);
            cursor: pointer;
        }

        /* Center Column (Timeline + Stage + Properties) */
        .center-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--ui-bg);
        }

        /* Timeline */
        .timeline-panel {
            height: 140px;
            background-color: var(--ui-bg);
            border-bottom: 1px solid var(--ui-shadow);
            border-top: 1px solid var(--ui-light);
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            background: linear-gradient(to right, #DFDFDF, #C0C0C0);
            border-bottom: 1px solid var(--ui-shadow);
            padding: 3px 5px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .timeline-content {
            display: flex;
            flex: 1;
        }

        .layers-area {
            width: 200px;
            background-color: var(--ui-highlight);
            border-right: 1px solid var(--ui-shadow);
            display: flex;
            flex-direction: column;
        }

        .layer-item {
            display: flex;
            align-items: center;
            padding: 2px 5px;
            background-color: #A6CAF0; /* Selected layer blue */
            border-bottom: 1px solid #CCC;
            height: 20px;
        }

        .layer-icon {
            margin-right: 5px;
            font-size: 12px;
        }

        .frames-area {
            flex: 1;
            background-color: #F8F8F8;
            overflow-x: auto;
            display: flex;
            flex-direction: column;
        }

        .frames-header {
            height: 15px;
            background-color: #E0E0E0;
            border-bottom: 1px solid var(--ui-shadow);
            display: flex;
        }

        .frame-tick {
            width: 10px;
            height: 10px;
            border-right: 1px solid #999;
            font-size: 8px;
            text-align: right;
            padding-right: 1px;
            color: #666;
            flex-shrink: 0;
        }

        .frame-track {
            height: 20px;
            display: flex;
            align-items: center;
            padding-left: 2px;
            border-bottom: 1px solid #E0E0E0;
        }

        .keyframe {
            width: 9px;
            height: 14px;
            background-color: #FFF;
            border: 1px solid var(--ui-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 1px;
        }
        
        .keyframe.active {
            background-color: #E6E6E6;
        }

        .keyframe-dot {
            width: 4px;
            height: 4px;
            background-color: black;
            border-radius: 50%;
        }

        .regular-frame {
            width: 9px;
            height: 14px;
            background-color: #E6E6E6;
            border-top: 1px solid var(--ui-shadow);
            border-bottom: 1px solid var(--ui-shadow);
            border-right: 1px solid #CCC;
            margin-right: 0px;
        }

        .playhead {
            position: absolute;
            width: 1px;
            height: 140px;
            background-color: red;
            left: 260px; /* Mock position */
            pointer-events: none;
        }
        
        .playhead-top {
            position: absolute;
            width: 9px;
            height: 12px;
            background-color: red;
            background-image: linear-gradient(to right, #ff9999, red, #990000);
            left: 256px;
            top: 25px; /* Adjust relative to timeline */
            border-radius: 2px;
            pointer-events: none;
        }

        /* Stage Area */
        .stage-area {
            flex: 1;
            background-color: var(--stage-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            position: relative;
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.5);
        }

        canvas {
            background-color: white;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            cursor: crosshair;
        }

        /* Properties Panel */
        .properties-panel {
            height: 100px;
            background-color: var(--ui-bg);
            border-top: 2px solid var(--ui-light);
            display: flex;
            flex-direction: column;
        }

        .prop-content {
            display: flex;
            padding: 10px;
            gap: 30px;
        }
        
        .prop-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .prop-row {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .prop-input {
            width: 40px;
            border: 1px inset var(--ui-shadow);
            background: white;
            padding: 1px 3px;
        }
        
        .prop-btn {
            background-color: var(--ui-bg);
            border-top: 1px solid var(--ui-light);
            border-left: 1px solid var(--ui-light);
            border-bottom: 1px solid var(--ui-dark-shadow);
            border-right: 1px solid var(--ui-dark-shadow);
            padding: 2px 8px;
            cursor: pointer;
        }
        
        .prop-btn:active {
            border-top: 1px solid var(--ui-dark-shadow);
            border-left: 1px solid var(--ui-dark-shadow);
            border-bottom: 1px solid var(--ui-light);
            border-right: 1px solid var(--ui-light);
        }

    </style>
</head>
<body>

    <!-- Menu Bar -->
    <div class="menu-bar">
        <div class="menu-item"><u>F</u>ile</div>
        <div class="menu-item"><u>E</u>dit</div>
        <div class="menu-item"><u>V</u>iew</div>
        <div class="menu-item"><u>I</u>nsert</div>
        <div class="menu-item"><u>M</u>odify</div>
        <div class="menu-item"><u>T</u>ext</div>
        <div class="menu-item"><u>C</u>ontrol</div>
        <div class="menu-item"><u>W</u>indow</div>
        <div class="menu-item"><u>H</u>elp</div>
    </div>

    <!-- Toolbar Mock -->
    <div class="toolbar">
        <span style="font-size: 14px; margin: 0 4px; color: #666;">📄 📁 💾</span>
        <div class="toolbar-divider"></div>
        <span style="font-size: 14px; margin: 0 4px; color: #666;">✂️ 📋 🗂️</span>
        <div class="toolbar-divider"></div>
        <span style="font-size: 14px; margin: 0 4px; color: #666;">↩️ ↪️</span>
    </div>

    <div class="workspace">
        <!-- Tools Panel -->
        <div class="tools-panel">
            <div class="tools-header">Tools</div>
            <div class="tools-grid" id="toolsGrid">
                <div class="tool-btn" data-tool="select" title="Selection Tool (V)">↖</div>
                <div class="tool-btn" data-tool="subselect" title="Subselection Tool (A)">⮬</div>
                <div class="tool-btn" data-tool="line" title="Line Tool (N)">\</div>
                <div class="tool-btn" data-tool="lasso" title="Lasso Tool (L)">⚟</div>
                <div class="tool-btn" data-tool="pen" title="Pen Tool (P)">✒</div>
                <div class="tool-btn" data-tool="text" title="Text Tool (T)">A</div>
                <div class="tool-btn" data-tool="oval" title="Oval Tool (O)">○</div>
                <div class="tool-btn" data-tool="rect" title="Rectangle Tool (R)">□</div>
                <div class="tool-btn" data-tool="pencil" title="Pencil Tool (Y)">✎</div>
                <div class="tool-btn active" data-tool="brush" title="Brush Tool (B)">🖌</div>
                <div class="tool-btn" data-tool="ink" title="Ink Bottle Tool (S)">✒️</div>
                <div class="tool-btn" data-tool="bucket" title="Paint Bucket Tool (K)">▧</div>
                <div class="tool-btn" data-tool="eraser" title="Eraser Tool (E)">▱</div>
                <div class="tool-btn" data-tool="zoom" title="Zoom Tool (Z)">🔍</div>
            </div>

            <div class="colors-section">
                <div class="color-picker-wrapper" title="Stroke Color">
                    <span class="color-label">✏️</span>
                    <input type="color" id="strokeColor" value="#000000">
                </div>
                <div class="color-picker-wrapper" title="Fill Color">
                    <span class="color-label">🪣</span>
                    <input type="color" id="fillColor" value="#FF0000">
                </div>
            </div>
        </div>

        <!-- Center Area -->
        <div class="center-column">
            <!-- Timeline -->
            <div class="timeline-panel">
                <div class="panel-header">
                    <span>Timeline</span>
                    <span>▾</span>
                </div>
                <div class="timeline-content">
                    <div class="layers-area">
                        <div class="layer-item">
                            <span class="layer-icon">👁️ 🔒</span> Layer 1
                        </div>
                    </div>
                    <div class="frames-area">
                        <div class="frames-header">
                            <!-- Generate frame ticks -->
                            <script>
                                for(let i=1; i<=30; i++) {
                                    document.write(`<div class="frame-tick">${i%5===0 ? i : ''}</div>`);
                                }
                            </script>
                        </div>
                        <div class="frame-track">
                            <div class="keyframe active"><div class="keyframe-dot"></div></div>
                            <!-- Generate regular frames -->
                            <script>
                                for(let i=2; i<=15; i++) {
                                    document.write(`<div class="regular-frame"></div>`);
                                }
                            </script>
                            <div class="regular-frame" style="background-color: white; border-left: 1px solid black;"></div>
                        </div>
                        <div class="playhead-top"></div>
                        <div class="playhead"></div>
                    </div>
                </div>
            </div>

            <!-- Stage -->
            <div class="stage-area">
                <canvas id="stage" width="550" height="400"></canvas>
            </div>

            <!-- Properties -->
            <div class="properties-panel">
                <div class="panel-header">
                    <span>Properties</span>
                    <span>▴</span>
                </div>
                <div class="prop-content">
                    <div class="prop-group">
                        <b style="font-size: 12px;">Document</b>
                        <span style="color: #666;">Untitled-1</span>
                    </div>
                    <div class="prop-group">
                        <div class="prop-row">
                            <span>Size:</span>
                            <div class="prop-btn">550 x 400 pixels</div>
                        </div>
                        <div class="prop-row">
                            <span>Publish:</span>
                            <div class="prop-btn">Flash Player 6</div>
                        </div>
                    </div>
                    <div class="prop-group">
                        <div class="prop-row">
                            <span>Background:</span>
                            <div style="width: 16px; height: 16px; background: white; border: 1px solid #999;"></div>
                        </div>
                        <div class="prop-row">
                            <span>Frame Rate:</span>
                            <input type="text" class="prop-input" value="12"> fps
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');
        const tools = document.querySelectorAll('.tool-btn');
        const strokeColorInput = document.getElementById('strokeColor');
        const fillColorInput = document.getElementById('fillColor');

        let currentTool = 'brush';
        let isDrawing = false;
        let startX = 0;
        let startY = 0;

        // Default canvas setup
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Tool Selection
        tools.forEach(btn => {
            btn.addEventListener('click', () => {
                tools.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTool = btn.dataset.tool;
                
                if(currentTool === 'eraser') {
                    canvas.style.cursor = 'url("data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'16\' height=\'16\' viewBox=\'0 0 16 16\'><rect width=\'16\' height=\'16\' fill=\'white\' stroke=\'black\'/></svg>") 8 8, auto';
                } else if(currentTool === 'pencil' || currentTool === 'brush' || currentTool === 'pen') {
                    canvas.style.cursor = 'crosshair';
                } else {
                    canvas.style.cursor = 'default';
                }
            });
        });

        // Drawing Logic
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            startX = e.offsetX;
            startY = e.offsetY;

            ctx.beginPath();
            ctx.moveTo(startX, startY);

            // Configure context based on tool
            ctx.strokeStyle = currentTool === 'eraser' ? '#FFFFFF' : strokeColorInput.value;
            ctx.fillStyle = fillColorInput.value;

            if(currentTool === 'brush') {
                ctx.lineWidth = 5;
            } else if (currentTool === 'pencil' || currentTool === 'line' || currentTool === 'rect' || currentTool === 'oval') {
                ctx.lineWidth = 1;
            } else if (currentTool === 'eraser') {
                ctx.lineWidth = 16;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;

            if (currentTool === 'brush' || currentTool === 'pencil' || currentTool === 'eraser') {
                ctx.lineTo(e.offsetX, e.offsetY);
                ctx.stroke();
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!isDrawing) return;
            isDrawing = false;

            // Handle shape drawing (primitive implementation)
            if (currentTool === 'line') {
                ctx.lineTo(e.offsetX, e.offsetY);
                ctx.stroke();
            } else if (currentTool === 'rect') {
                const width = e.offsetX - startX;
                const height = e.offsetY - startY;
                ctx.fillRect(startX, startY, width, height);
                ctx.strokeRect(startX, startY, width, height);
            } else if (currentTool === 'oval') {
                const radiusX = Math.abs(e.offsetX - startX) / 2;
                const radiusY = Math.abs(e.offsetY - startY) / 2;
                const centerX = startX + (e.offsetX - startX) / 2;
                const centerY = startY + (e.offsetY - startY) / 2;
                
                ctx.beginPath();
                ctx.ellipse(centerX, centerY, radiusX, radiusY, 0, 0, 2 * Math.PI);
                ctx.fill();
                ctx.stroke();
            }
        });

        canvas.addEventListener('mouseleave', () => {
            isDrawing = false;
        });

    </script>
</body>
</html>
