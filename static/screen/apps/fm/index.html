<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Manager</title>
  <link rel="stylesheet" href="style.css">
<style id="xp-footballmanager-compat">
html,body{
    width:100% !important;
    height:100% !important;
    margin:0 !important;
    min-width:0 !important;
    min-height:0 !important;
}
body{
    overflow:auto !important;
}
.xp-dialog-shade{
    display:none;
    position:fixed;
    inset:0;
    z-index:2147483646;
    background:rgba(0,0,0,.24);
    align-items:center;
    justify-content:center;
    padding:18px;
}
.xp-dialog-shade.show{display:flex}
.xp-dialog{
    width:min(420px,92vw);
    background:#ECE9D8;
    color:#000;
    border:2px outset #fff;
    box-shadow:4px 4px 14px rgba(0,0,0,.48);
    font:11px Tahoma,sans-serif;
}
.xp-dialog-title{
    min-height:25px;
    display:flex;
    align-items:center;
    padding:3px 7px;
    color:#fff;
    font-weight:bold;
    background:linear-gradient(90deg,#0a246a,#3a6ea5);
}
.xp-dialog-body{
    padding:12px;
    white-space:pre-wrap;
    line-height:1.4;
}
.xp-dialog-actions{
    text-align:right;
    padding:0 12px 11px;
}
.xp-dialog-actions button{
    min-width:78px;
    height:25px;
    background:#ECE9D8;
    border:2px outset #fff;
    font:11px Tahoma,sans-serif;
}
.xp-dialog-actions button:active{
    border-style:inset;
}
</style>

<script id="xp-footballmanager-dialog-shim">
(function(){
    function ensureDialog(){
        var shade=document.getElementById('xpFMDialogShade');
        if(shade) return shade;

        shade=document.createElement('div');
        shade.id='xpFMDialogShade';
        shade.className='xp-dialog-shade';

        shade.innerHTML=
            '<div class="xp-dialog" role="dialog" aria-modal="true">'+
              '<div class="xp-dialog-title">Football Manager</div>'+
              '<div class="xp-dialog-body" id="xpFMDialogMessage"></div>'+
              '<div class="xp-dialog-actions">'+
                '<button type="button" id="xpFMDialogOK">Tamam</button>'+
              '</div>'+
            '</div>';

        document.body.appendChild(shade);

        shade.querySelector('#xpFMDialogOK').onclick=function(){
            shade.classList.remove('show');
        };

        return shade;
    }

    function showMessage(message){
        var shade=ensureDialog();
        var msg=shade.querySelector('#xpFMDialogMessage');
        if(msg) msg.textContent=String(message == null ? '' : message);
        shade.classList.add('show');
    }

    window.alert=function(message){
        showMessage(message);
    };

    window.confirm=function(message){
        showMessage(message);
        return false;
    };

    window.prompt=function(message){
        showMessage(message);
        return null;
    };
})();
</script>
</head>
<body>
  <div id="app"></div>

  <script src="js/dataEPL.js"></script>
  <script src="js/dataLaLiga.js"></script>
  <script src="js/dataSerieA.js"></script>
  <script src="js/dataBundesliga.js"></script>
  <script src="js/dataLigaPortugal.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/season.js"></script>
  <script src="js/manager.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
