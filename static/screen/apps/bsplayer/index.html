<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BS.Player</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: Tahoma, sans-serif;
    font-size: 11px;
    background: #080b0d;
    color: #111;
    user-select: none;
}

button,
input {
    font-family: Tahoma, sans-serif;
    font-size: 11px;
}

/* =========================================================
   APPLICATION
   No outer XP title bar is created here.
   WindowManager owns that part.
   ========================================================= */

#app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #050607;
}

/* VIDEO AREA */

.video-area {
    position: relative;
    flex: 1 1 auto;
    min-height: 90px;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 45%, #202a30 0, #0b1014 35%, #000 72%);
}

.video-area.dragover::after {
    content: "Drop media files here";
    position: absolute;
    inset: 18px;
    border: 2px dashed #69c4ed;
    background: rgba(10,48,70,.86);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    z-index: 50;
}

#media {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

#media.audio-only {
    opacity: 0;
    pointer-events: none;
}

/* idle / audio presentation */

.idle-screen {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    color: #d9e6eb;
}

.idle-logo {
    text-align: center;
    opacity: .92;
}

.idle-logo .bs {
    font-family: Arial, sans-serif;
    font-weight: bold;
    font-style: italic;
    font-size: clamp(28px, 8vw, 67px);
    letter-spacing: -4px;
    color: #e6edf0;
    text-shadow:
        1px 1px 0 #57646b,
        2px 2px 3px #000;
}

.idle-logo .player {
    color: #2ba4db;
}

.idle-logo small {
    display: block;
    font-size: 11px;
    letter-spacing: 1px;
    color: #82949d;
    margin-top: 4px;
}

#audioViz {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    display: none;
}

.audio-mode #audioViz {
    display: block;
}

/* subtitles */

.subtitle-overlay {
    position: absolute;
    z-index: 10;
    left: 4%;
    right: 4%;
    bottom: 6%;
    text-align: center;
    pointer-events: none;
    color: #fff;
    font-family: Arial, sans-serif;
    font-weight: bold;
    font-size: clamp(16px, 3vw, 27px);
    line-height: 1.25;
    text-shadow:
        -2px -2px 1px #000,
         2px -2px 1px #000,
        -2px  2px 1px #000,
         2px  2px 1px #000,
         0    2px 3px #000;
}

.subtitle-overlay.hidden {
    display: none;
}

/* =========================================================
   BS.PLAYER CONTROL DECK
   This is the application's own UI, not another window frame.
   ========================================================= */

.control-deck {
    flex: 0 0 auto;
    position: relative;
    min-height: 116px;
    padding: 7px 9px 6px;
    color: #dceef5;

    background:
        linear-gradient(
            to bottom,
            #596a71 0,
            #35474f 5%,
            #182c36 12%,
            #0a2838 48%,
            #092235 74%,
            #081a27 100%
        );

    border-top: 1px solid #869ba5;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.35),
        inset 0 -1px 0 #000;
}

.control-deck::before {
    content: "";
    position: absolute;
    left: 9px;
    right: 9px;
    top: 4px;
    height: 1px;
    background: rgba(255,255,255,.25);
}

/* info display */

.info-row {
    min-height: 43px;
    display: grid;
    grid-template-columns: 83px minmax(0,1fr) 110px;
    gap: 8px;
    align-items: stretch;
}

.brand-box {
    display: flex;
    align-items: center;
    padding: 1px 6px;
    color: #dbe8ec;
    font-size: 15px;
    font-style: italic;
    font-family: Arial, sans-serif;
    font-weight: bold;
    text-shadow: 1px 1px #000;
}

.brand-box span {
    color: #55b9e2;
}

.lcd {
    position: relative;
    overflow: hidden;
    min-width: 0;
    padding: 4px 8px 3px;
    color: #bdeaff;
    background:
        linear-gradient(to bottom, #074060, #062b45 45%, #041e34);
    border: 1px solid #092234;
    border-radius: 2px;
    box-shadow:
        inset 0 0 7px #000,
        0 1px 0 rgba(255,255,255,.2);
}

.lcd::after {
    content: "";
    position: absolute;
    inset: 1px;
    pointer-events: none;
    border-top: 1px solid rgba(120,220,255,.18);
}

.filename {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    color: #d5f4ff;
    height: 16px;
    line-height: 16px;
}

.sub-info {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    height: 15px;
    color: #7fc8e5;
}

.clock-box {
    padding: 4px 6px;
    background:
        linear-gradient(#0c3b54,#062236);
    border: 1px solid #071722;
    box-shadow:
        inset 0 0 5px #000,
        0 1px rgba(255,255,255,.18);
    text-align: center;
    color: #bce9fb;
}

#timeDisplay {
    display: block;
    font-family: "Courier New", monospace;
    font-size: 12px;
    font-weight: bold;
    white-space: nowrap;
}

#mediaInfo {
    margin-top: 4px;
    display: block;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    color: #6eb5d2;
    font-size: 9px;
}

/* seek */

.seek-row {
    display: flex;
    align-items: center;
    margin: 5px 0 6px;
    gap: 6px;
}

.seek {
    flex: 1;
}

input[type="range"] {
    height: 13px;
    margin: 0;
    cursor: pointer;
    accent-color: #3e9aca;
}

/* buttons */

.bottom-row {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
}

.ctrl {
    position: relative;
    min-width: 27px;
    height: 25px;
    padding: 0 7px;

    color: #d6e3e7;
    font-weight: bold;
    text-shadow: 1px 1px #000;

    border:
        1px solid #0b1419;
    border-radius: 3px;

    background:
        linear-gradient(
            to bottom,
            #819097 0,
            #536169 9%,
            #34454e 43%,
            #172c37 48%,
            #10232d 100%
        );

    box-shadow:
        inset 1px 1px rgba(255,255,255,.28),
        inset -1px -1px rgba(0,0,0,.6);
}

.ctrl:hover {
    filter: brightness(1.16);
}

.ctrl:active,
.ctrl.active {
    background:
        linear-gradient(to bottom,#10232d,#304750);
    box-shadow:
        inset 2px 2px 4px #000;
    transform: translateY(1px);
}

.ctrl.primary {
    min-width: 34px;
    color: #fff;
}

.ctrl.text {
    font-size: 9px;
    min-width: 35px;
}

.spacer {
    flex: 1;
}

.volume-label {
    color: #77b7d2;
    font-size: 9px;
}

#volume {
    width: 90px;
}

/* playlist */

.playlist-panel {
    display: none;
    flex: 0 0 138px;
    min-height: 90px;
    max-height: 40vh;
    flex-direction: column;
    background: #ECE9D8;
    color: #000;
    border-top: 1px solid #ACA899;
}

.playlist-panel.visible {
    display: flex;
}

.playlist-toolbar {
    height: 27px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 4px;
    background: #ECE9D8;
    border-bottom: 1px solid #ACA899;
}

.xp-button {
    min-width: 58px;
    height: 21px;
    padding: 1px 8px;
    background: #ECE9D8;
    color: #000;
    border: 2px outset #fff;
}

.xp-button:active {
    border-style: inset;
}

.playlist {
    flex: 1;
    overflow: auto;
    background: #fff;
    border: 1px solid #7F9DB9;
}

.track {
    min-height: 19px;
    padding: 2px 5px;
    display: grid;
    grid-template-columns: 22px minmax(0,1fr) 60px;
    gap: 4px;
    align-items: center;
    cursor: default;
}

.track:nth-child(even) {
    background: #fafafa;
}

.track:hover {
    background: #e8f1fb;
}

.track.selected {
    background: #316AC5;
    color: #fff;
}

.track-name {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.track-duration {
    text-align: right;
    font-size: 10px;
}

/* status */

.statusbar {
    flex: 0 0 20px;
    display: flex;
    align-items: center;
    padding: 2px 5px;
    background: #ECE9D8;
    color: #333;
    border-top: 1px solid #fff;
}

.statusbar span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

#statusText {
    flex: 1;
}

#statusRight {
    flex: 0 0 auto;
    padding-left: 8px;
    color: #555;
}

/* dialogs */

.dialog-shade {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 500;
    background: rgba(0,0,0,.25);
}

.dialog-shade.visible {
    display: flex;
}

.xp-dialog {
    width: min(390px, calc(100vw - 24px));
    color: #000;
    background: #ECE9D8;
    border: 1px solid #003C74;
    box-shadow:
        2px 2px 5px rgba(0,0,0,.55),
        inset 1px 1px #fff;
}

.dialog-title {
    height: 25px;
    line-height: 25px;
    padding: 0 7px;
    color: #fff;
    font-weight: bold;
    background:
        linear-gradient(to right,#0A246A,#3A6EA5,#0A246A);
}

.dialog-body {
    padding: 13px;
}

.dialog-message {
    min-height: 34px;
    line-height: 16px;
}

.dialog-input {
    width: 100%;
    height: 23px;
    margin-top: 7px;
    padding: 2px 4px;
    border: 1px solid #7F9DB9;
    background: #fff;
    color: #000;
    user-select: text;
}

.dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 12px;
}

.dialog-actions .xp-button {
    min-width: 75px;
}

.settings-grid {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 8px;
    align-items: center;
}

select {
    height: 22px;
    font-family: Tahoma, sans-serif;
    font-size: 11px;
    border: 1px solid #7F9DB9;
    background: white;
}

/* tiny overlay notification */

.toast {
    position: absolute;
    z-index: 100;
    left: 50%;
    top: 14px;
    transform: translateX(-50%);
    display: none;
    max-width: 80%;
    padding: 5px 10px;
    background: rgba(0,0,0,.72);
    border: 1px solid rgba(255,255,255,.35);
    color: #fff;
    border-radius: 2px;
    pointer-events: none;
}

.toast.visible {
    display: block;
}

@media (max-width: 520px) {
    .info-row {
        grid-template-columns: 66px minmax(0,1fr);
    }

    .clock-box {
        display: none;
    }

    .brand-box {
        font-size: 12px;
        padding-left: 1px;
    }

    #volume {
        width: 65px;
    }

    .ctrl {
        padding: 0 5px;
        min-width: 25px;
    }

    .control-deck {
        min-height: 109px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div class="video-area" id="videoArea">

        <video id="media" preload="metadata" playsinline></video>

        <canvas id="audioViz"></canvas>

        <div class="idle-screen" id="idleScreen">
            <div class="idle-logo">
                <div class="bs">BS.<span class="player">Player</span></div>
                <small>multimedia player</small>
            </div>
        </div>

        <div class="subtitle-overlay" id="subtitle"></div>
        <div class="toast" id="toast"></div>

    </div>

    <!--
        This is BS.Player's internal control panel.
        There is deliberately NO XP window title bar.
    -->
    <div class="control-deck">

        <div class="info-row">

            <div class="brand-box">
                BS.<span>Player</span>
            </div>

            <div class="lcd">
                <div class="filename" id="filename">No media loaded</div>
                <div class="sub-info" id="subInfo">No subtitles</div>
            </div>

            <div class="clock-box">
                <span id="timeDisplay">00:00:00 / 00:00:00</span>
                <span id="mediaInfo">0 × 0</span>
            </div>

        </div>

        <div class="seek-row">
            <input
                id="seek"
                class="seek"
                type="range"
                min="0"
                max="1000"
                value="0"
                aria-label="Seek">
        </div>

        <div class="bottom-row">

            <button class="ctrl" id="prevBtn" title="Previous">|◀</button>
            <button class="ctrl primary" id="playBtn" title="Play / Pause">▶</button>
            <button class="ctrl" id="stopBtn" title="Stop">■</button>
            <button class="ctrl" id="nextBtn" title="Next">▶|</button>

            <button class="ctrl text" id="openBtn" title="Open file">OPEN</button>

            <button class="ctrl text" id="subBtn" title="Load subtitles">SUB</button>

            <button class="ctrl text" id="playlistBtn" title="Playlist">PL</button>

            <button class="ctrl text" id="repeatBtn" title="Repeat">REP</button>

            <button class="ctrl text" id="shuffleBtn" title="Shuffle">RND</button>

            <div class="spacer"></div>

            <button class="ctrl text" id="urlBtn" title="Open URL">URL</button>
            <button class="ctrl text" id="settingsBtn" title="Preferences">OPT</button>

            <button class="ctrl" id="muteBtn" title="Mute">🔊</button>

            <span class="volume-label">VOL</span>

            <input
                id="volume"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.8"
                aria-label="Volume">

            <button class="ctrl text" id="fullscreenBtn" title="Fullscreen">FS</button>

        </div>

    </div>

    <div class="playlist-panel" id="playlistPanel">

        <div class="playlist-toolbar">
            <button class="xp-button" id="addBtn">Add...</button>
            <button class="xp-button" id="removeBtn">Remove</button>
            <button class="xp-button" id="clearBtn">Clear</button>
        </div>

        <div class="playlist" id="playlist"></div>

    </div>

    <div class="statusbar">
        <span id="statusText">Ready</span>
        <span id="statusRight">BS.Player Web XP</span>
    </div>

</div>

<input
    type="file"
    id="mediaPicker"
    accept="video/*,audio/*,.mkv,.avi,.mpg,.mpeg,.wmv,.mov,.m4a,.flac"
    multiple
    hidden>

<input
    type="file"
    id="subtitlePicker"
    accept=".srt,.vtt,text/vtt"
    hidden>

<!-- ======================================================
     URL DIALOG
     ====================================================== -->

<div class="dialog-shade" id="urlDialog">
    <div class="xp-dialog">

        <div class="dialog-title">Open URL</div>

        <div class="dialog-body">

            <div class="dialog-message">
                Enter the address of a media file or stream:
            </div>

            <input
                class="dialog-input"
                id="urlInput"
                type="text"
                autocomplete="off"
                placeholder="https://example.com/video.mp4">

            <div class="dialog-actions">
                <button class="xp-button" data-close="urlDialog">Cancel</button>
                <button class="xp-button" id="urlOpenConfirm">Open</button>
            </div>

        </div>

    </div>
</div>

<!-- ======================================================
     SETTINGS DIALOG
     ====================================================== -->

<div class="dialog-shade" id="settingsDialog">
    <div class="xp-dialog">

        <div class="dialog-title">BS.Player Preferences</div>

        <div class="dialog-body">

            <div class="settings-grid">

                <label for="speedSelect">Playback speed:</label>

                <select id="speedSelect">
                    <option value="0.5">0.50×</option>
                    <option value="0.75">0.75×</option>
                    <option value="1" selected>1.00×</option>
                    <option value="1.25">1.25×</option>
                    <option value="1.5">1.50×</option>
                    <option value="2">2.00×</option>
                </select>

                <span>Subtitle delay:</span>

                <div>
                    <button class="xp-button" id="subMinus">-0.5 s</button>
                    <button class="xp-button" id="subPlus">+0.5 s</button>
                </div>

                <span>Subtitle status:</span>
                <strong id="offsetLabel">0.0 s</strong>

                <span>Video scaling:</span>

                <select id="fitSelect">
                    <option value="contain">Keep aspect ratio</option>
                    <option value="fill">Stretch</option>
                    <option value="cover">Fill screen</option>
                </select>

            </div>

            <div class="dialog-actions">
                <button class="xp-button" data-close="settingsDialog">Close</button>
            </div>

        </div>

    </div>
</div>

<!-- ======================================================
     GENERIC XP DIALOG
     ====================================================== -->

<div class="dialog-shade" id="messageDialog">
    <div class="xp-dialog">

        <div class="dialog-title" id="messageTitle">BS.Player</div>

        <div class="dialog-body">

            <div class="dialog-message" id="messageBody"></div>

            <div class="dialog-actions">
                <button class="xp-button" data-close="messageDialog">OK</button>
            </div>

        </div>

    </div>
</div>

<script>
(() => {
    "use strict";

    /* =====================================================
       ELEMENTS
       ===================================================== */

    const app = document.getElementById("app");
    const media = document.getElementById("media");
    const videoArea = document.getElementById("videoArea");
    const idleScreen = document.getElementById("idleScreen");
    const subtitleEl = document.getElementById("subtitle");
    const toast = document.getElementById("toast");

    const filenameEl = document.getElementById("filename");
    const subInfo = document.getElementById("subInfo");
    const timeDisplay = document.getElementById("timeDisplay");
    const mediaInfo = document.getElementById("mediaInfo");

    const seek = document.getElementById("seek");
    const volume = document.getElementById("volume");

    const playBtn = document.getElementById("playBtn");
    const stopBtn = document.getElementById("stopBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    const openBtn = document.getElementById("openBtn");
    const addBtn = document.getElementById("addBtn");

    const subBtn = document.getElementById("subBtn");
    const playlistBtn = document.getElementById("playlistBtn");
    const repeatBtn = document.getElementById("repeatBtn");
    const shuffleBtn = document.getElementById("shuffleBtn");

    const muteBtn = document.getElementById("muteBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");

    const urlBtn = document.getElementById("urlBtn");
    const settingsBtn = document.getElementById("settingsBtn");

    const mediaPicker = document.getElementById("mediaPicker");
    const subtitlePicker = document.getElementById("subtitlePicker");

    const playlistPanel = document.getElementById("playlistPanel");
    const playlistEl = document.getElementById("playlist");

    const removeBtn = document.getElementById("removeBtn");
    const clearBtn = document.getElementById("clearBtn");

    const statusText = document.getElementById("statusText");

    const urlDialog = document.getElementById("urlDialog");
    const urlInput = document.getElementById("urlInput");
    const urlOpenConfirm = document.getElementById("urlOpenConfirm");

    const settingsDialog = document.getElementById("settingsDialog");
    const speedSelect = document.getElementById("speedSelect");
    const fitSelect = document.getElementById("fitSelect");
    const subMinus = document.getElementById("subMinus");
    const subPlus = document.getElementById("subPlus");
    const offsetLabel = document.getElementById("offsetLabel");

    const messageDialog = document.getElementById("messageDialog");
    const messageTitle = document.getElementById("messageTitle");
    const messageBody = document.getElementById("messageBody");

    const audioViz = document.getElementById("audioViz");
    const vizCtx = audioViz.getContext("2d");

    /* =====================================================
       STATE
       ===================================================== */

    let playlist = [];
    let selectedIndex = -1;

    let repeat = false;
    let shuffle = false;
    let userSeeking = false;

    let subtitles = [];
    let subtitleOffset = 0;
    let subtitlesEnabled = true;

    let toastTimer = 0;

    let audioContext = null;
    let analyser = null;
    let mediaSource = null;
    let analyserArray = null;
    let visualizerStarted = false;

    media.volume = Number(
        localStorage.getItem("bsplayer-volume") || "0.8"
    );

    volume.value = String(media.volume);

    /* =====================================================
       WEB AUDIO BEEP
       ===================================================== */

    function beep(freq = 650, duration = 0.045) {
        try {
            const ctx = new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = "square";
            osc.frequency.value = freq;

            gain.gain.setValueAtTime(0.035, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                ctx.currentTime + duration
            );

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start();
            osc.stop(ctx.currentTime + duration);

            osc.onended = () => ctx.close();
        } catch (_) {}
    }

    /* =====================================================
       DIALOG SYSTEM
       ===================================================== */

    function showDialog(dialog) {
        dialog.classList.add("visible");

        const field = dialog.querySelector("input");
        if (field) {
            setTimeout(() => field.focus(), 20);
        }
    }

    function hideDialog(dialog) {
        dialog.classList.remove("visible");
    }

    function showMessage(title, text) {
        messageTitle.textContent = title;
        messageBody.textContent = text;
        showDialog(messageDialog);
        beep(410, 0.08);
    }

    document.querySelectorAll("[data-close]").forEach(button => {
        button.addEventListener("click", () => {
            const id = button.dataset.close;
            const dialog = document.getElementById(id);

            if (dialog) {
                hideDialog(dialog);
            }
        });
    });

    document.querySelectorAll(".dialog-shade").forEach(shade => {
        shade.addEventListener("mousedown", event => {
            if (event.target === shade) {
                hideDialog(shade);
            }
        });
    });

    /* =====================================================
       TOAST
       ===================================================== */

    function showToast(text) {
        toast.textContent = text;
        toast.classList.add("visible");

        clearTimeout(toastTimer);

        toastTimer = setTimeout(() => {
            toast.classList.remove("visible");
        }, 1300);
    }

    /* =====================================================
       TIME
       ===================================================== */

    function formatTime(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) {
            seconds = 0;
        }

        seconds = Math.floor(seconds);

        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;

        return (
            String(h).padStart(2, "0") + ":" +
            String(m).padStart(2, "0") + ":" +
            String(s).padStart(2, "0")
        );
    }

    function updateTimeUI() {
        const current = media.currentTime || 0;
        const duration = media.duration || 0;

        timeDisplay.textContent =
            `${formatTime(current)} / ${formatTime(duration)}`;

        if (!userSeeking && Number.isFinite(duration) && duration > 0) {
            seek.value = String(
                Math.round((current / duration) * 1000)
            );
        }

        updateSubtitle();
    }

    /* =====================================================
       MEDIA TYPE
       ===================================================== */

    function extensionOf(name = "") {
        const dot = name.lastIndexOf(".");
        return dot >= 0
            ? name.slice(dot + 1).toLowerCase()
            : "";
    }

    function isAudio(name, type = "") {
        if (type.startsWith("audio/")) {
            return true;
        }

        return [
            "mp3",
            "wav",
            "ogg",
            "oga",
            "flac",
            "aac",
            "m4a",
            "opus"
        ].includes(extensionOf(name));
    }

    function refreshMediaMode(item) {
        const audio = item
            ? isAudio(item.name, item.type)
            : false;

        videoArea.classList.toggle("audio-mode", audio);
        media.classList.toggle("audio-only", audio);

        idleScreen.style.display =
            audio || !item ? "flex" : "none";

        if (audio) {
            startAudioVisualizer();
        }
    }

    /* =====================================================
       PLAYLIST
       ===================================================== */

    function addFiles(fileList, autoPlay = true) {
        const files = [...fileList];

        if (!files.length) {
            return;
        }

        let firstAdded = -1;

        files.forEach(file => {
            if (
                file.name.toLowerCase().endsWith(".srt") ||
                file.name.toLowerCase().endsWith(".vtt")
            ) {
                loadSubtitleFile(file);
                return;
            }

            const url = URL.createObjectURL(file);

            playlist.push({
                name: file.name,
                url,
                type: file.type || "",
                local: true,
                duration: ""
            });

            if (firstAdded === -1) {
                firstAdded = playlist.length - 1;
            }
        });

        renderPlaylist();

        if (firstAdded >= 0) {
            loadTrack(firstAdded, autoPlay);
        }
    }

    function addRemote(url) {
        playlist.push({
            name: url.split("/").pop() || url,
            url,
            type: "",
            local: false,
            duration: ""
        });

        renderPlaylist();
        loadTrack(playlist.length - 1, true);
    }

    function renderPlaylist() {
        playlistEl.innerHTML = "";

        playlist.forEach((item, index) => {
            const row = document.createElement("div");
            row.className =
                "track" +
                (index === selectedIndex ? " selected" : "");

            const no = document.createElement("span");
            no.textContent = String(index + 1).padStart(2, "0");

            const name = document.createElement("span");
            name.className = "track-name";
            name.textContent = item.name;

            const duration = document.createElement("span");
            duration.className = "track-duration";
            duration.textContent = item.duration || "";

            row.append(no, name, duration);

            row.addEventListener("dblclick", () => {
                loadTrack(index, true);
            });

            row.addEventListener("click", () => {
                selectedIndex = index;
                renderPlaylist();
            });

            playlistEl.appendChild(row);
        });
    }

    async function loadTrack(index, autoPlay = false) {
        if (
            index < 0 ||
            index >= playlist.length
        ) {
            return;
        }

        selectedIndex = index;

        const item = playlist[index];

        media.pause();
        media.src = item.url;
        media.load();

        filenameEl.textContent = item.name;
        statusText.textContent = `Opening ${item.name}...`;

        refreshMediaMode(item);
        renderPlaylist();

        subtitles = [];
        subtitleEl.textContent = "";
        subInfo.textContent = "No subtitles";

        if (autoPlay) {
            try {
                await media.play();
            } catch (error) {
                statusText.textContent = "Ready to play";
            }
        }
    }

    function removeSelected() {
        if (
            selectedIndex < 0 ||
            selectedIndex >= playlist.length
        ) {
            return;
        }

        const removingCurrent =
            media.src === playlist[selectedIndex].url;

        const item = playlist[selectedIndex];

        if (item.local) {
            try {
                URL.revokeObjectURL(item.url);
            } catch (_) {}
        }

        playlist.splice(selectedIndex, 1);

        if (!playlist.length) {
            selectedIndex = -1;

            if (removingCurrent) {
                stopPlayback();
                media.removeAttribute("src");
                media.load();

                filenameEl.textContent = "No media loaded";
                mediaInfo.textContent = "0 × 0";

                refreshMediaMode(null);
            }
        } else {
            selectedIndex = Math.min(
                selectedIndex,
                playlist.length - 1
            );

            if (removingCurrent) {
                loadTrack(selectedIndex, false);
            }
        }

        renderPlaylist();
    }

    function clearPlaylist() {
        media.pause();
        media.removeAttribute("src");
        media.load();

        playlist.forEach(item => {
            if (item.local) {
                try {
                    URL.revokeObjectURL(item.url);
                } catch (_) {}
            }
        });

        playlist = [];
        selectedIndex = -1;

        subtitles = [];
        subtitleEl.textContent = "";

        filenameEl.textContent = "No media loaded";
        subInfo.textContent = "No subtitles";
        mediaInfo.textContent = "0 × 0";
        statusText.textContent = "Ready";

        refreshMediaMode(null);
        renderPlaylist();
        updateTimeUI();
    }

    /* =====================================================
       PLAYBACK
       ===================================================== */

    async function togglePlay() {
        if (!media.src) {
            mediaPicker.click();
            return;
        }

        if (media.paused) {
            try {
                await media.play();
            } catch (error) {
                showMessage(
                    "BS.Player",
                    "The selected media could not be played by this browser."
                );
            }
        } else {
            media.pause();
        }
    }

    function stopPlayback() {
        media.pause();

        try {
            media.currentTime = 0;
        } catch (_) {}

        playBtn.textContent = "▶";
        statusText.textContent = "Stopped";
        updateTimeUI();
    }

    function playNext() {
        if (!playlist.length) {
            return;
        }

        if (shuffle && playlist.length > 1) {
            let next = selectedIndex;

            while (next === selectedIndex) {
                next = Math.floor(
                    Math.random() * playlist.length
                );
            }

            loadTrack(next, true);
            return;
        }

        let next = selectedIndex + 1;

        if (next >= playlist.length) {
            next = 0;
        }

        loadTrack(next, true);
    }

    function playPrevious() {
        if (!playlist.length) {
            return;
        }

        let previous = selectedIndex - 1;

        if (previous < 0) {
            previous = playlist.length - 1;
        }

        loadTrack(previous, true);
    }

    /* =====================================================
       SUBTITLES
       ===================================================== */

    function parseTimestamp(value) {
        const clean = value.trim().replace(",", ".");
        const parts = clean.split(":");

        if (parts.length !== 3) {
            return 0;
        }

        return (
            Number(parts[0]) * 3600 +
            Number(parts[1]) * 60 +
            Number(parts[2])
        );
    }

    function parseSubtitles(text) {
        const normalized = text
            .replace(/\r/g, "")
            .replace(/^WEBVTT[^\n]*\n+/i, "")
            .trim();

        const blocks = normalized.split(/\n{2,}/);

        const parsed = [];

        for (const block of blocks) {
            const lines = block.split("\n");

            let timeLineIndex = lines.findIndex(
                line => line.includes("-->")
            );

            if (timeLineIndex < 0) {
                continue;
            }

            const timing = lines[timeLineIndex]
                .split("-->");

            if (timing.length !== 2) {
                continue;
            }

            const start =
                parseTimestamp(timing[0]);

            const end =
                parseTimestamp(
                    timing[1]
                        .trim()
                        .split(/\s+/)[0]
                );

            const textLines = lines
                .slice(timeLineIndex + 1)
                .join("\n")
                .replace(/<[^>]+>/g, "");

            if (textLines) {
                parsed.push({
                    start,
                    end,
                    text: textLines
                });
            }
        }

        return parsed;
    }

    function loadSubtitleFile(file) {
        const reader = new FileReader();

        reader.onerror = () => {
            showMessage(
                "Subtitle Error",
                "The subtitle file could not be read."
            );
        };

        reader.onload = () => {
            try {
                subtitles = parseSubtitles(
                    String(reader.result)
                );

                if (!subtitles.length) {
                    throw new Error("No subtitle entries");
                }

                subtitlesEnabled = true;
                subtitleEl.classList.remove("hidden");

                subInfo.textContent =
                    file.name +
                    ` (${subtitles.length} subtitles)`;

                statusText.textContent =
                    `Subtitle loaded: ${file.name}`;

                showToast(
                    `${subtitles.length} subtitles loaded`
                );

            } catch (_) {
                showMessage(
                    "Subtitle Error",
                    "This subtitle file is not a valid SRT/VTT file."
                );
            }
        };

        reader.readAsText(file);
    }

    function updateSubtitle() {
        if (
            !subtitlesEnabled ||
            !subtitles.length
        ) {
            subtitleEl.textContent = "";
            return;
        }

        const time =
            (media.currentTime || 0) +
            subtitleOffset;

        const entry = subtitles.find(
            item =>
                time >= item.start &&
                time <= item.end
        );

        subtitleEl.textContent =
            entry ? entry.text : "";
    }

    function adjustSubtitleOffset(amount) {
        subtitleOffset =
            Math.round(
                (subtitleOffset + amount) * 10
            ) / 10;

        offsetLabel.textContent =
            `${subtitleOffset.toFixed(1)} s`;

        showToast(
            `Subtitle delay ${subtitleOffset >= 0 ? "+" : ""}${subtitleOffset.toFixed(1)} s`
        );

        updateSubtitle();
    }

    /* =====================================================
       FULLSCREEN
       ===================================================== */

    async function toggleFullscreen() {
        try {
            if (!document.fullscreenElement) {
                await videoArea.requestFullscreen();
            } else {
                await document.exitFullscreen();
            }
        } catch (_) {
            showMessage(
                "Fullscreen",
                "Fullscreen mode is not available inside this iframe."
            );
        }
    }

    /* =====================================================
       AUDIO VISUALIZER
       ===================================================== */

    function initAudioAnalyser() {
        if (audioContext) {
            return;
        }

        try {
            audioContext = new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

            analyser = audioContext.createAnalyser();
            analyser.fftSize = 128;

            analyserArray =
                new Uint8Array(
                    analyser.frequencyBinCount
                );

            mediaSource =
                audioContext.createMediaElementSource(media);

            mediaSource.connect(analyser);
            analyser.connect(audioContext.destination);

        } catch (_) {
            audioContext = null;
        }
    }

    function startAudioVisualizer() {
        initAudioAnalyser();

        if (visualizerStarted) {
            return;
        }

        visualizerStarted = true;

        function draw() {
            requestAnimationFrame(draw);

            const rect =
                audioViz.getBoundingClientRect();

            const scale =
                window.devicePixelRatio || 1;

            const width =
                Math.max(
                    1,
                    Math.floor(rect.width * scale)
                );

            const height =
                Math.max(
                    1,
                    Math.floor(rect.height * scale)
                );

            if (
                audioViz.width !== width ||
                audioViz.height !== height
            ) {
                audioViz.width = width;
                audioViz.height = height;
            }

            vizCtx.clearRect(
                0,
                0,
                width,
                height
            );

            const gradient =
                vizCtx.createLinearGradient(
                    0,
                    0,
                    0,
                    height
                );

            gradient.addColorStop(
                0,
                "rgba(19,92,123,.35)"
            );

            gradient.addColorStop(
                1,
                "rgba(0,0,0,.9)"
            );

            vizCtx.fillStyle = gradient;
            vizCtx.fillRect(
                0,
                0,
                width,
                height
            );

            if (
                !analyser ||
                !analyserArray
            ) {
                return;
            }

            analyser.getByteFrequencyData(
                analyserArray
            );

            const count =
                analyserArray.length;

            const gap =
                2 * scale;

            const barWidth =
                Math.max(
                    2 * scale,
                    width / count - gap
                );

            for (
                let i = 0;
                i < count;
                i++
            ) {
                const value =
                    analyserArray[i] / 255;

                const h =
                    value *
                    height *
                    0.72;

                const x =
                    i * (barWidth + gap);

                const y =
                    height - h;

                const barGradient =
                    vizCtx.createLinearGradient(
                        0,
                        y,
                        0,
                        height
                    );

                barGradient.addColorStop(
                    0,
                    "#a8f0ff"
                );

                barGradient.addColorStop(
                    .35,
                    "#34a9d7"
                );

                barGradient.addColorStop(
                    1,
                    "#07527b"
                );

                vizCtx.fillStyle =
                    barGradient;

                vizCtx.fillRect(
                    x,
                    y,
                    barWidth,
                    h
                );
            }
        }

        draw();
    }

       EVENTS
       ===================================================== */

    playBtn.addEventListener(
        "click",
        togglePlay
    );

    stopBtn.addEventListener(
        "click",
        stopPlayback
    );

    nextBtn.addEventListener(
        "click",
        playNext
    );

    prevBtn.addEventListener(
        "click",
        playPrevious
    );

    openBtn.addEventListener(
        "click",
        () => mediaPicker.click()
    );

    addBtn.addEventListener(
        "click",
        () => mediaPicker.click()
    );

    mediaPicker.addEventListener(
        "change",
        () => {
            addFiles(
                mediaPicker.files,
                true
            );

            mediaPicker.value = "";
        }
    );

    subBtn.addEventListener(
        "click",
        () => {
            if (subtitles.length) {
                subtitlesEnabled =
                    !subtitlesEnabled;

                subtitleEl.classList.toggle(
                    "hidden",
                    !subtitlesEnabled
                );

                subBtn.classList.toggle(
                    "active",
                    subtitlesEnabled
                );

                showToast(
                    subtitlesEnabled
                        ? "Subtitles enabled"
                        : "Subtitles disabled"
                );
            } else {
                subtitlePicker.click();
            }
        }
    );

    subtitlePicker.addEventListener(
        "change",
        () => {
            const file =
                subtitlePicker.files[0];

            if (file) {
                loadSubtitleFile(file);
            }

            subtitlePicker.value = "";
        }
    );

    playlistBtn.addEventListener(
        "click",
        () => {
            playlistPanel.classList.toggle(
                "visible"
            );

            playlistBtn.classList.toggle(
                "active"
            );
        }
    );

    repeatBtn.addEventListener(
        "click",
        () => {
            repeat = !repeat;

            repeatBtn.classList.toggle(
                "active",
                repeat
            );

            showToast(
                repeat
                    ? "Repeat on"
                    : "Repeat off"
            );
        }
    );

    shuffleBtn.addEventListener(
        "click",
        () => {
            shuffle = !shuffle;

            shuffleBtn.classList.toggle(
                "active",
                shuffle
            );

            showToast(
                shuffle
                    ? "Shuffle on"
                    : "Shuffle off"
            );
        }
    );

    muteBtn.addEventListener(
        "click",
        () => {
            media.muted = !media.muted;

            muteBtn.textContent =
                media.muted ? "🔇" : "🔊";

            showToast(
                media.muted
                    ? "Muted"
                    : "Sound on"
            );
        }
    );

    fullscreenBtn.addEventListener(
        "click",
        toggleFullscreen
    );

    videoArea.addEventListener(
        "dblclick",
        toggleFullscreen
    );

    volume.addEventListener(
        "input",
        () => {
            media.volume =
                Number(volume.value);

            media.muted = false;
            muteBtn.textContent = "🔊";

            localStorage.setItem(
                "bsplayer-volume",
                String(media.volume)
            );
        }
    );

    seek.addEventListener(
        "pointerdown",
        () => {
            userSeeking = true;
        }
    );

    seek.addEventListener(
        "input",
        () => {
            if (
                Number.isFinite(media.duration) &&
                media.duration > 0
            ) {
                const target =
                    Number(seek.value) /
                    1000 *
                    media.duration;

                timeDisplay.textContent =
                    `${formatTime(target)} / ${formatTime(media.duration)}`;
            }
        }
    );

    function commitSeek() {
        if (
            Number.isFinite(media.duration) &&
            media.duration > 0
        ) {
            media.currentTime =
                Number(seek.value) /
                1000 *
                media.duration;
        }

        userSeeking = false;
    }

    seek.addEventListener(
        "change",
        commitSeek
    );

    seek.addEventListener(
        "pointerup",
        commitSeek
    );

    removeBtn.addEventListener(
        "click",
        removeSelected
    );

    clearBtn.addEventListener(
        "click",
        clearPlaylist
    );

    urlBtn.addEventListener(
        "click",
        () => {
            urlInput.value = "";
            showDialog(urlDialog);
        }
    );

    urlOpenConfirm.addEventListener(
        "click",
        () => {
            const url =
                urlInput.value.trim();

            if (!url) {
                return;
            }

            try {
                const parsed =
                    new URL(
                        url,
                        window.location.href
                    );

                addRemote(parsed.href);
                hideDialog(urlDialog);

            } catch (_) {
                showMessage(
                    "Open URL",
                    "The address is not valid."
                );
            }
        }
    );

    urlInput.addEventListener(
        "keydown",
        event => {
            if (event.key === "Enter") {
                urlOpenConfirm.click();
            }
        }
    );

    settingsBtn.addEventListener(
        "click",
        () => showDialog(settingsDialog)
    );

    speedSelect.addEventListener(
        "change",
        () => {
            media.playbackRate =
                Number(speedSelect.value);
        }
    );

    fitSelect.addEventListener(
        "change",
        () => {
            media.style.objectFit =
                fitSelect.value;
        }
    );

    subMinus.addEventListener(
        "click",
        () => adjustSubtitleOffset(-0.5)
    );

    subPlus.addEventListener(
        "click",
        () => adjustSubtitleOffset(0.5)
    );

    /* =====================================================
       MEDIA EVENTS
       ===================================================== */

    media.addEventListener(
        "play",
        async () => {
            playBtn.textContent = "Ⅱ";
            statusText.textContent = "Playing";

            if (
                audioContext &&
                audioContext.state === "suspended"
            ) {
                try {
                    await audioContext.resume();
                } catch (_) {}
            }
        }
    );

    media.addEventListener(
        "pause",
        () => {
            playBtn.textContent = "▶";

            if (
                media.currentTime > 0 &&
                !media.ended
            ) {
                statusText.textContent = "Paused";
            }
        }
    );

    media.addEventListener(
        "timeupdate",
        updateTimeUI
    );

    media.addEventListener(
        "durationchange",
        updateTimeUI
    );

    media.addEventListener(
        "loadedmetadata",
        () => {
            const item =
                playlist[selectedIndex];

            if (item) {
                item.duration =
                    formatTime(media.duration);

                renderPlaylist();
            }

            const width =
                media.videoWidth || 0;

            const height =
                media.videoHeight || 0;

            if (width && height) {
                mediaInfo.textContent =
                    `${width} × ${height}`;
            } else {
                mediaInfo.textContent =
                    "Audio";
            }

            statusText.textContent =
                "Media loaded";

            updateTimeUI();
        }
    );

    media.addEventListener(
        "ended",
        () => {
            if (repeat) {
                media.currentTime = 0;
                media.play().catch(() => {});
            } else if (
                playlist.length > 1
            ) {
                playNext();
            } else {
                playBtn.textContent = "▶";
                statusText.textContent =
                    "Playback finished";
            }
        }
    );

    media.addEventListener(
        "error",
        () => {
            if (!media.src) {
                return;
            }

            statusText.textContent =
                "Playback error";

            showMessage(
                "BS.Player Error",
                "This file cannot be decoded by your browser. " +
                "Old BS.Player used Windows codecs/DirectShow, while this web edition uses the browser's built-in media codecs."
            );
        }
    );

    media.addEventListener(
        "volumechange",
        () => {
            muteBtn.textContent =
                media.muted ||
                media.volume === 0
                    ? "🔇"
                    : "🔊";
        }
    );

    /* =====================================================
       DRAG AND DROP
       ===================================================== */

    let dragDepth = 0;

    window.addEventListener(
        "dragenter",
        event => {
            event.preventDefault();
            dragDepth++;
            videoArea.classList.add(
                "dragover"
            );
        }
    );

    window.addEventListener(
        "dragover",
        event => {
            event.preventDefault();
        }
    );

    window.addEventListener(
        "dragleave",
        event => {
            event.preventDefault();

            dragDepth--;

            if (dragDepth <= 0) {
                dragDepth = 0;
                videoArea.classList.remove(
                    "dragover"
                );
            }
        }
    );

    window.addEventListener(
        "drop",
        event => {
            event.preventDefault();

            dragDepth = 0;
            videoArea.classList.remove(
                "dragover"
            );

            if (
                event.dataTransfer &&
                event.dataTransfer.files.length
            ) {
                addFiles(
                    event.dataTransfer.files,
                    true
                );
            }
        }
    );

    /* =====================================================
       KEYBOARD
       ===================================================== */

    document.addEventListener(
        "keydown",
        event => {
            const tag =
                document.activeElement?.tagName;

            if (
                tag === "INPUT" ||
                tag === "SELECT"
            ) {
                if (event.key === "Escape") {
                    document
                        .querySelectorAll(
                            ".dialog-shade.visible"
                        )
                        .forEach(hideDialog);
                }

                return;
            }

            switch (event.key.toLowerCase()) {

                case " ":
                    event.preventDefault();
                    togglePlay();
                    break;

                case "arrowleft":
                    event.preventDefault();

                    if (media.src) {
                        media.currentTime =
                            Math.max(
                                0,
                                media.currentTime - 5
                            );

                        showToast("-5 sec");
                    }
                    break;

                case "arrowright":
                    event.preventDefault();

                    if (media.src) {
                        media.currentTime =
                            Math.min(
                                media.duration || Infinity,
                                media.currentTime + 5
                            );

                        showToast("+5 sec");
                    }
                    break;

                case "arrowup":
                    event.preventDefault();

                    media.volume =
                        Math.min(
                            1,
                            media.volume + 0.05
                        );

                    volume.value =
                        String(media.volume);

                    showToast(
                        `Volume ${Math.round(media.volume * 100)}%`
                    );
                    break;

                case "arrowdown":
                    event.preventDefault();

                    media.volume =
                        Math.max(
                            0,
                            media.volume - 0.05
                        );

                    volume.value =
                        String(media.volume);

                    showToast(
                        `Volume ${Math.round(media.volume * 100)}%`
                    );
                    break;

                case "m":
                    media.muted = !media.muted;
                    showToast(
                        media.muted
                            ? "Muted"
                            : "Sound on"
                    );
                    break;

                case "f":
                    toggleFullscreen();
                    break;

                case "o":
                    mediaPicker.click();
                    break;

                case "s":
                    subtitlePicker.click();
                    break;

                case "p":
                    playlistPanel.classList.toggle(
                        "visible"
                    );

                    playlistBtn.classList.toggle(
                        "active"
                    );
                    break;

                case "[":
                    adjustSubtitleOffset(-0.5);
                    break;

                case "]":
                    adjustSubtitleOffset(0.5);
                    break;

                case "escape":
                    document
                        .querySelectorAll(
                            ".dialog-shade.visible"
                        )
                        .forEach(hideDialog);
                    break;
            }
        }
    );

    /* =====================================================
       INITIALIZATION
       ===================================================== */

    refreshMediaMode(null);
    updateTimeUI();

    window.addEventListener(
        "beforeunload",
        () => {
            playlist.forEach(item => {
                if (item.local) {
                    try {
                        URL.revokeObjectURL(
                            item.url
                        );
                    } catch (_) {}
                }
            });
        }
    );

})();
</script>

</body>
</html>
