<!--
GOOGLE CHROME 49 - WINDOWS XP WEB SIMULATOR - ASSET LISTESI

| Dosya adi | Tavsiye edilen boyut | Zorunluluk | Kullanim / Aciklama |
|------------|----------------------|------------|----------------------------------------------|
| icon.png   | 32x32                | Zorunlu    | XP masaustu / uygulama ikonu                 |

NOTLAR:
- Bu uygulama gerçek Google Chrome executable'ı değildir.
- Windows XP dönemindeki Chrome 49 görünüm ve tarayıcı iş akışını web içinde simüle eder.
- Google araması için iframe içinde ?igu=1 tabanlı Google sayfası denenir.
- Harici siteler X-Frame-Options / CSP frame-ancestors ile iframe'i engelleyebilir; bu web güvenlik politikası uygulama tarafından aşılamaz.
- Dış XP Luna başlık çubuğu ve görev çubuğu ana WindowManager tarafından sağlanır; burada ikinci bir Windows başlık çubuğu çizilmez.
- alert(), confirm(), prompt() kullanılmaz; tüm mesajlar uygulama içi .xp-dialog ile gösterilir.
-->
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Google Chrome</title>
<style>
:root{
  --chrome:#d8d8d8;
  --chrome2:#ececec;
  --tab:#f6f6f6;
  --tabinactive:#bdbdbd;
  --line:#a8a8a8;
  --blue:#4285f4;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font:12px Arial,Tahoma,sans-serif;background:#fff;color:#222}
button,input{font:inherit}
button{cursor:default}
#app{width:100%;height:100%;display:grid;grid-template-rows:31px 38px 24px 1fr;background:#fff}
#app.incognito{--chrome:#35363a;--chrome2:#414245;--tab:#4c4d50;--tabinactive:#303134;--line:#202124;color:#eee}

/* TAB STRIP */
.tabstrip{
  min-width:0;display:flex;align-items:end;padding:4px 5px 0;
  background:linear-gradient(#c6c6c6,#b8b8b8);border-bottom:1px solid #a6a6a6;
  overflow:hidden
}
#app.incognito .tabstrip{background:linear-gradient(#35363a,#2d2e31);border-color:#202124}
.tabs{display:flex;align-items:end;gap:1px;min-width:0;overflow:hidden;flex:1}
.tab{
  height:27px;min-width:95px;max-width:210px;width:170px;
  display:flex;align-items:center;gap:6px;padding:0 7px 0 9px;
  color:#333;background:linear-gradient(#c9c9c9,#bcbcbc);
  border:1px solid #a0a0a0;border-bottom:0;border-radius:7px 7px 0 0;
  position:relative;flex:0 1 170px
}
.tab.active{
  z-index:2;background:linear-gradient(#fff,#e9e9e9);height:28px;color:#111
}
#app.incognito .tab{background:#303134;border-color:#252525;color:#ccc}
#app.incognito .tab.active{background:#4b4c50;color:#fff}
.favicon{width:16px;height:16px;display:flex;align-items:center;justify-content:center;flex:0 0 16px}
.favicon.chromeDot{border-radius:50%;background:conic-gradient(#db4437 0 33%,#0f9d58 33% 66%,#f4b400 66% 100%);position:relative}
.favicon.chromeDot:after{content:"";position:absolute;inset:4px;border-radius:50%;background:#4285f4;border:1px solid #fff}
.tabtitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;font-size:11px}
.tabclose{
  width:16px;height:16px;border:0;background:transparent;border-radius:50%;
  padding:0;color:#555;line-height:14px
}
.tabclose:hover{background:#aaa;color:#111}
#app.incognito .tabclose{color:#ccc}
.newtab{
  width:28px;height:23px;margin:0 0 2px 3px;border:1px solid transparent;background:transparent;
  color:#444;font-size:20px;line-height:18px
}
.newtab:hover{background:#d3d3d3;border-color:#aaa}
#app.incognito .newtab{color:#ddd}.newtab:active{transform:translateY(1px)}

/* TOOLBAR */
.toolbar{
  display:grid;grid-template-columns:auto auto auto auto minmax(100px,1fr) auto auto;
  align-items:center;gap:3px;padding:4px 6px;background:linear-gradient(#f2f2f2,#dedede);
  border-bottom:1px solid #b3b3b3
}
#app.incognito .toolbar{background:linear-gradient(#4b4c50,#3d3e42);border-color:#242529}
.navbtn{
  width:27px;height:27px;border:1px solid transparent;border-radius:4px;background:transparent;
  font:bold 17px Arial;color:#555;padding:0
}
.navbtn:hover:not(:disabled){border-color:#aaa;background:#f7f7f7}
.navbtn:disabled{opacity:.35}
#app.incognito .navbtn{color:#e5e5e5}.navbtn:active:not(:disabled){background:#d5d5d5}
.omnibox{
  height:28px;display:flex;align-items:center;gap:5px;padding:0 6px;
  border:1px solid #aaa;border-radius:4px;background:#fff;box-shadow:inset 0 1px 2px #ddd;min-width:0
}
#app.incognito .omnibox{background:#2d2e31;border-color:#65676b;box-shadow:none;color:#fff}
.lock{font-size:12px;color:#777;flex:0 0 auto}
.address{
  flex:1;min-width:0;height:22px;border:0;outline:0;background:transparent;color:#222;font:12px Arial
}
#app.incognito .address{color:#eee}
.star{border:0;background:transparent;font-size:19px;color:#888;padding:0 3px}
.star.on{color:#f4b400}
.menuBtn{
  width:31px;height:27px;border:1px solid transparent;border-radius:4px;background:transparent;
  font-size:20px;color:#666;line-height:20px
}
.menuBtn:hover{border-color:#aaa;background:#f7f7f7}
#app.incognito .menuBtn{color:#ddd}

/* BOOKMARKS */
.bookmarks{
  display:flex;align-items:center;gap:3px;padding:1px 7px;
  background:#f5f5f5;border-bottom:1px solid #c8c8c8;overflow:hidden
}
#app.incognito .bookmarks{background:#3d3e42;border-color:#26272a}
.bookmark{
  height:20px;border:0;background:transparent;border-radius:3px;padding:0 6px;color:#444;font-size:11px;white-space:nowrap
}
.bookmark:hover{background:#dedede}
#app.incognito .bookmark{color:#ddd}.bookmarks .apps{font-weight:bold;color:#555}

/* PAGE AREA */
.pagearea{position:relative;min-height:0;background:#fff}
.webframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.internal{position:absolute;inset:0;overflow:auto;background:#fff;color:#333}
.hidden{display:none!important}

/* NTP */
.ntp{
  min-height:100%;display:flex;flex-direction:column;align-items:center;padding-top:11vh;
  background:#fff
}
.googleLogo{
  font:64px Arial,sans-serif;letter-spacing:-5px;margin-bottom:24px;white-space:nowrap
}
.googleLogo span:nth-child(1),.googleLogo span:nth-child(4){color:#4285f4}
.googleLogo span:nth-child(2),.googleLogo span:nth-child(6){color:#db4437}
.googleLogo span:nth-child(3){color:#f4b400}.googleLogo span:nth-child(5){color:#0f9d58}
.ntpSearch{
  width:min(560px,78vw);height:42px;display:flex;border:1px solid #bbb;border-radius:2px;box-shadow:0 1px 4px #bbb;background:#fff
}
.ntpSearch input{flex:1;border:0;outline:0;padding:0 12px;font-size:16px}
.ntpSearch button{width:48px;border:0;background:#4285f4;color:#fff;font-size:18px}
.tiles{display:grid;grid-template-columns:repeat(4,120px);gap:15px;margin-top:34px}
.tile{
  height:95px;border:1px solid #d0d0d0;background:#f8f8f8;border-radius:2px;text-align:center;padding:13px 5px 5px;
  font-size:11px;overflow:hidden
}
.tile:hover{border-color:#aaa;box-shadow:0 1px 3px #ccc}
.tileIcon{
  margin:0 auto 9px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font:bold 17px Arial
}

/* Chrome internal pages */
.chromePage{max-width:900px;margin:0 auto;padding:28px 38px 55px}
.chromePage h1{font-size:24px;font-weight:normal;border-bottom:1px solid #ddd;padding-bottom:12px;margin:0 0 18px}
.chromePage h2{font-size:15px;margin:20px 0 8px}
.settingRow{
  padding:10px 0;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;gap:20px
}
.settingRow label{font-weight:bold}
.chromePage input[type=text],.chromePage select{
  min-width:220px;height:26px;border:1px solid #aaa;border-radius:2px;padding:3px 6px;background:#fff
}
.chromeBtn{
  height:28px;padding:0 13px;border:1px solid #aaa;border-radius:2px;background:linear-gradient(#fff,#e6e6e6);color:#333
}
.chromeBtn:hover{border-color:#777}
.listItem{
  display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid #eee
}
.listItem .time{color:#888;font-size:11px}
.bigChrome{
  width:86px;height:86px;margin:15px auto;border-radius:50%;background:conic-gradient(#db4437 0 33%,#0f9d58 33% 66%,#f4b400 66% 100%);
  position:relative
}
.bigChrome:after{content:"";position:absolute;inset:25px;border-radius:50%;background:#4285f4;border:4px solid white}
.about{text-align:center;max-width:520px;margin:25px auto}
.warning{
  padding:8px 10px;background:#fff7d5;border:1px solid #dfc866;color:#5d531f;margin:12px 0;font-size:11px
}
.downloadShelf{
  display:none;position:absolute;left:0;right:0;bottom:0;height:42px;background:#eee;border-top:1px solid #bbb;padding:5px 8px;z-index:10
}
.downloadShelf.show{display:flex;gap:6px;align-items:center}
.downloadItem{height:30px;min-width:220px;border:1px solid #bbb;background:#fafafa;padding:6px 9px;font-size:11px}

/* menu dropdown */
.chromeMenu{
  display:none;position:absolute;right:5px;top:65px;z-index:100;width:260px;padding:5px 0;background:#fff;color:#222;
  border:1px solid #aaa;box-shadow:0 3px 12px rgba(0,0,0,.28);font-size:12px
}
.chromeMenu.show{display:block}
.menuItem{height:29px;padding:6px 18px;display:flex;justify-content:space-between}
.menuItem:hover{background:#eee}
.menuSep{height:1px;background:#ddd;margin:4px 0}
.shortcut{color:#888}

/* info overlay */
.frameInfo{
  display:none;position:absolute;left:8px;right:8px;top:7px;z-index:8;padding:7px 10px;
  background:#fffbe7;border:1px solid #d7c66b;color:#514b22;font-size:11px
}
.frameInfo.show{display:flex;justify-content:space-between;align-items:center;gap:10px}
.frameInfo button{border:1px solid #aaa;background:#f6f6f6;border-radius:2px;padding:3px 8px}

/* XP in-page dialogs */
.dialogShade{
  display:none;position:absolute;inset:0;z-index:200;background:rgba(0,0,0,.20);align-items:center;justify-content:center;padding:18px
}
.dialogShade.show{display:flex}
.xp-dialog{
  width:min(430px,92vw);background:#ece9d8;color:#000;border:2px outset #fff;box-shadow:4px 5px 14px rgba(0,0,0,.45);
  font:11px Tahoma,sans-serif
}
.xp-title{
  min-height:25px;display:flex;align-items:center;justify-content:space-between;padding:2px 3px 2px 7px;
  color:#fff;font-weight:bold;background:linear-gradient(90deg,#0a246a,#3a6ea5)
}
.xp-title button{width:21px;height:20px;padding:0;color:#fff;background:#d8503c;border:2px outset #fff;font-weight:bold}
.xp-body{padding:13px;line-height:1.45;white-space:pre-wrap}
.xp-actions{display:flex;justify-content:flex-end;gap:7px;padding:0 12px 11px}
.xp-actions button{min-width:82px;height:25px;background:#ece9d8;border:2px outset #fff;font:11px Tahoma,sans-serif}

@media(max-width:740px){
  .bookmarks{display:none}
  #app{grid-template-rows:31px 38px 0 1fr}
  .tiles{grid-template-columns:repeat(2,120px)}
  .toolbar{grid-template-columns:auto auto auto minmax(80px,1fr) auto}
  #homeBtn,#starBtn{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div class="tabstrip">
    <div class="tabs" id="tabs"></div>
    <button class="newtab" id="newTabBtn" title="Yeni sekme" type="button">+</button>
  </div>

  <div class="toolbar">
    <button class="navbtn" id="backBtn" title="Geri" type="button">‹</button>
    <button class="navbtn" id="forwardBtn" title="İleri" type="button">›</button>
    <button class="navbtn" id="reloadBtn" title="Yenile" type="button">↻</button>
    <button class="navbtn" id="homeBtn" title="Ana sayfa" type="button">⌂</button>
    <div class="omnibox">
      <span class="lock" id="securityIcon">ⓘ</span>
      <input class="address" id="address" type="text" spellcheck="false" autocomplete="off" value="chrome://newtab">
      <button class="star" id="starBtn" title="Bu sayfaya yer işareti koy" type="button">☆</button>
    </div>
    <button class="navbtn" id="downloadsBtn" title="İndirilenler" type="button">⇩</button>
    <button class="menuBtn" id="menuBtn" title="Google Chrome'u özelleştirin ve kontrol edin" type="button">≡</button>
  </div>

  <div class="bookmarks" id="bookmarkBar">
    <button class="bookmark apps" data-url="chrome://apps" type="button">▦ Uygulamalar</button>
    <button class="bookmark" data-url="https://www.google.com/webhp?igu=1" type="button">Google</button>
    <button class="bookmark" data-url="https://www.wikipedia.org/" type="button">Wikipedia</button>
    <button class="bookmark" data-url="chrome://history" type="button">Geçmiş</button>
    <button class="bookmark" data-url="chrome://downloads" type="button">İndirilenler</button>
  </div>

  <main class="pagearea">
    <iframe class="webframe hidden" id="webframe" title="Web sayfası" referrerpolicy="no-referrer"></iframe>
    <div class="frameInfo" id="frameInfo">
      <span>Bazı siteler güvenlik politikaları nedeniyle başka bir sayfa içindeki iframe'de açılmayabilir.</span>
      <button id="dismissInfo" type="button">Kapat</button>
    </div>
    <div class="internal" id="internal"></div>
    <div class="downloadShelf" id="downloadShelf"></div>
  </main>

  <div class="chromeMenu" id="chromeMenu">
    <div class="menuItem" data-menu-action="newtab"><span>Yeni sekme</span><span class="shortcut">Ctrl+T</span></div>
    <div class="menuItem" data-menu-action="incognito"><span>Yeni gizli pencere modu</span><span class="shortcut">Ctrl+Shift+N</span></div>
    <div class="menuSep"></div>
    <div class="menuItem" data-url="chrome://bookmarks"><span>Yer işaretleri</span><span></span></div>
    <div class="menuItem" data-url="chrome://history"><span>Geçmiş</span><span class="shortcut">Ctrl+H</span></div>
    <div class="menuItem" data-url="chrome://downloads"><span>İndirilenler</span><span class="shortcut">Ctrl+J</span></div>
    <div class="menuSep"></div>
    <div class="menuItem" data-url="chrome://settings"><span>Ayarlar</span><span></span></div>
    <div class="menuItem" data-url="chrome://help"><span>Google Chrome Hakkında</span><span></span></div>
    <div class="menuSep"></div>
    <div class="menuItem" data-menu-action="exit"><span>Çıkış</span><span></span></div>
  </div>

  <div class="dialogShade" id="dialogShade">
    <div class="xp-dialog">
      <div class="xp-title"><span id="dialogTitle">Google Chrome</span><button id="dialogX" type="button">×</button></div>
      <div class="xp-body" id="dialogText"></div>
      <div class="xp-actions" id="dialogActions"></div>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';

const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const STORAGE='xp_chrome49_sim_v1';

const defaults={
  home:'chrome://newtab',
  search:'Google',
  showBookmarks:true,
  history:[],
  bookmarks:[
    {title:'Google',url:'https://www.google.com/webhp?igu=1'},
    {title:'Wikipedia',url:'https://www.wikipedia.org/'}
  ],
  downloads:[
    {name:'example-download.zip',status:'Tamamlandı',size:'1,2 MB'}
  ],
  incognito:false
};

function load(){
  try{return Object.assign(structuredClone(defaults),JSON.parse(localStorage.getItem(STORAGE)||'{}'))}
  catch{return structuredClone(defaults)}
}
let state=load();
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch{}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let tabs=[];
let activeId=null;
let tabSeq=0;

function newTab(url='chrome://newtab',activate=true){
  const id=++tabSeq;
  tabs.push({id,title:'Yeni Sekme',url:'chrome://newtab',history:['chrome://newtab'],index:0});
  if(activate)activeId=id;
  renderTabs();
  if(activate)navigate(url,{replace:true,noHistory:true});
}
function activeTab(){return tabs.find(t=>t.id===activeId)}
function renderTabs(){
  $('#tabs').innerHTML=tabs.map(t=>`
    <div class="tab ${t.id===activeId?'active':''}" data-tab="${t.id}">
      <i class="favicon chromeDot"></i>
      <span class="tabtitle">${esc(t.title)}</span>
      <button class="tabclose" type="button" data-close="${t.id}" title="Kapat">×</button>
    </div>`).join('');
}
$('#tabs').addEventListener('click',e=>{
  const close=e.target.closest('[data-close]');
  if(close){
    e.stopPropagation();
    closeTab(+close.dataset.close);
    return;
  }
  const t=e.target.closest('[data-tab]');
  if(!t)return;
  activeId=+t.dataset.tab;
  renderTabs();renderCurrent();
});
function closeTab(id){
  const idx=tabs.findIndex(t=>t.id===id);
  if(idx<0)return;
  tabs.splice(idx,1);
  if(!tabs.length)return newTab();
  if(id===activeId)activeId=tabs[Math.max(0,idx-1)].id;
  renderTabs();renderCurrent();
}
$('#newTabBtn').onclick=()=>newTab();

/* Address handling */
function normalizeInput(v){
  v=v.trim();
  if(!v)return 'chrome://newtab';
  if(/^chrome:\/\//i.test(v))return v.toLowerCase();
  if(/^https?:\/\//i.test(v))return v;
  if(/^www\./i.test(v))return 'https://'+v;
  if(/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(v))return 'https://'+v;
  return 'https://www.google.com/search?igu=1&q='+encodeURIComponent(v);
}
function displayAddress(url){
  if(url.startsWith('https://www.google.com/search?igu=1&q=')){
    try{return decodeURIComponent(url.split('&q=')[1]||'')}catch{return url}
  }
  return url;
}
function titleFor(url){
  if(url==='chrome://newtab')return 'Yeni Sekme';
  if(url==='chrome://history')return 'Geçmiş';
  if(url==='chrome://downloads')return 'İndirilenler';
  if(url==='chrome://settings')return 'Ayarlar';
  if(url==='chrome://help')return 'Google Chrome Hakkında';
  if(url==='chrome://bookmarks')return 'Yer İşaretleri';
  if(url==='chrome://apps')return 'Uygulamalar';
  if(url.includes('google.com/search'))return 'Google Arama';
  try{return new URL(url).hostname.replace(/^www\./,'')}catch{return 'Google Chrome'}
}
function pushHistory(url,title){
  if(state.incognito||url.startsWith('chrome://'))return;
  state.history.unshift({url,title,time:new Date().toLocaleString('tr-TR')});
  state.history=state.history.slice(0,120);save();
}
function navigate(raw,opts={}){
  const tab=activeTab();if(!tab)return;
  const url=normalizeInput(raw);
  if(!opts.noHistory){
    tab.history=tab.history.slice(0,tab.index+1);
    tab.history.push(url);tab.index++;
  }else if(opts.replace){
    tab.history[tab.index]=url;
  }
  tab.url=url;tab.title=titleFor(url);
  pushHistory(url,tab.title);
  renderTabs();renderCurrent();
}
function renderCurrent(){
  const tab=activeTab();if(!tab)return;
  $('#address').value=displayAddress(tab.url);
  $('#backBtn').disabled=tab.index<=0;
  $('#forwardBtn').disabled=tab.index>=tab.history.length-1;
  $('#securityIcon').textContent=tab.url.startsWith('https://')?'🔒':'ⓘ';
  const bookmarked=state.bookmarks.some(b=>b.url===tab.url);
  $('#starBtn').classList.toggle('on',bookmarked);$('#starBtn').textContent=bookmarked?'★':'☆';
  renderTabs();

  if(tab.url.startsWith('chrome://')){
    $('#webframe').classList.add('hidden');
    $('#frameInfo').classList.remove('show');
    $('#internal').classList.remove('hidden');
    renderInternal(tab.url);
  }else{
    $('#internal').classList.add('hidden');
    $('#webframe').classList.remove('hidden');
    $('#webframe').src=tab.url;
    $('#frameInfo').classList.add('show');
  }
}
$('#address').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();navigate($('#address').value);$('#address').blur()}
});
$('#address').addEventListener('focus',()=>$('#address').select());

$('#backBtn').onclick=()=>{
  const t=activeTab();if(t.index<=0)return;t.index--;t.url=t.history[t.index];t.title=titleFor(t.url);renderCurrent()
};
$('#forwardBtn').onclick=()=>{
  const t=activeTab();if(t.index>=t.history.length-1)return;t.index++;t.url=t.history[t.index];t.title=titleFor(t.url);renderCurrent()
};
$('#reloadBtn').onclick=()=>{
  const t=activeTab();if(!t)return;
  if(t.url.startsWith('chrome://'))renderCurrent();
  else $('#webframe').src=t.url;
};
$('#homeBtn').onclick=()=>navigate(state.home);
$('#dismissInfo').onclick=()=>$('#frameInfo').classList.remove('show');

$('#starBtn').onclick=()=>{
  const t=activeTab();if(!t||t.url.startsWith('chrome://'))return;
  const i=state.bookmarks.findIndex(b=>b.url===t.url);
  if(i>=0)state.bookmarks.splice(i,1);
  else state.bookmarks.push({title:t.title,url:t.url});
  save();renderCurrent();
};

/* bookmark bar */
$('#bookmarkBar').addEventListener('click',e=>{
  const b=e.target.closest('[data-url]');if(b)navigate(b.dataset.url)
});
function updateBookmarkBar(){
  $('#bookmarkBar').style.display=state.showBookmarks?'flex':'none';
}
updateBookmarkBar();

/* internal pages */
function renderInternal(url){
  if(url==='chrome://newtab')renderNTP();
  else if(url==='chrome://history')renderHistory();
  else if(url==='chrome://downloads')renderDownloads();
  else if(url==='chrome://settings')renderSettings();
  else if(url==='chrome://help')renderAbout();
  else if(url==='chrome://bookmarks')renderBookmarks();
  else if(url==='chrome://apps')renderApps();
  else $('#internal').innerHTML='<div class="chromePage"><h1>Sayfa bulunamadı</h1></div>';
}
function renderNTP(){
 $('#internal').innerHTML=`
  <div class="ntp">
   <div class="googleLogo"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></div>
   <form class="ntpSearch" id="ntpForm">
    <input id="ntpInput" autocomplete="off" aria-label="Google'da ara">
    <button type="submit">⌕</button>
   </form>
   <div class="tiles">
    <div class="tile" data-go="https://www.google.com/webhp?igu=1"><div class="tileIcon" style="background:#4285f4">G</div>Google</div>
    <div class="tile" data-go="https://www.wikipedia.org/"><div class="tileIcon" style="background:#555">W</div>Wikipedia</div>
    <div class="tile" data-go="chrome://history"><div class="tileIcon" style="background:#6f8faf">↶</div>Geçmiş</div>
    <div class="tile" data-go="chrome://downloads"><div class="tileIcon" style="background:#49a46b">↓</div>İndirilenler</div>
   </div>
  </div>`;
 $('#ntpForm').onsubmit=e=>{e.preventDefault();navigate($('#ntpInput').value)};
 $$('.tile[data-go]').forEach(x=>x.onclick=()=>navigate(x.dataset.go));
}
function renderHistory(){
 $('#internal').innerHTML=`
  <div class="chromePage">
   <h1>Geçmiş</h1>
   <div style="text-align:right;margin-bottom:8px"><button class="chromeBtn" id="clearHistory">Tarama verilerini temizle...</button></div>
   <div>${state.history.length?state.history.map((h,i)=>`
    <div class="listItem" data-hist="${i}">
      <span>◷</span><div><b>${esc(h.title)}</b><br><span class="small">${esc(h.url)}</span></div><span class="time">${esc(h.time)}</span>
    </div>`).join(''):'<p>Henüz geçmiş yok.</p>'}</div>
  </div>`;
 $('#clearHistory').onclick=()=>dialog('Tarama verilerini temizle','Tarama geçmişi temizlensin mi?',[
   {label:'Temizle',action:()=>{state.history=[];save();hideDialog();renderHistory()}},
   {label:'İptal',action:hideDialog}
 ]);
 $$('[data-hist]').forEach(x=>x.ondblclick=()=>navigate(state.history[+x.dataset.hist].url));
}
function renderDownloads(){
 $('#internal').innerHTML=`
  <div class="chromePage">
   <h1>İndirilenler</h1>
   ${state.downloads.map(d=>`<div class="listItem"><span>⇩</span><div><b>${esc(d.name)}</b><br><span class="small">${esc(d.status)}</span></div><span>${esc(d.size)}</span></div>`).join('')}
   <div class="warning">Bu Chrome simülasyonu gerçek tarayıcı indirme yöneticisinin dosya sistemine erişemez. Buradaki öğeler yerel demo kayıtlarıdır.</div>
  </div>`;
}
function renderBookmarks(){
 $('#internal').innerHTML=`
  <div class="chromePage">
   <h1>Yer İşaretleri</h1>
   ${state.bookmarks.map((b,i)=>`<div class="listItem" data-book="${i}"><span>★</span><div><b>${esc(b.title)}</b><br><span class="small">${esc(b.url)}</span></div><button class="chromeBtn" data-del="${i}">Sil</button></div>`).join('')}
  </div>`;
 $$('[data-book]').forEach(x=>x.ondblclick=e=>{if(!e.target.closest('[data-del]'))navigate(state.bookmarks[+x.dataset.book].url)});
 $$('[data-del]').forEach(x=>x.onclick=()=>{state.bookmarks.splice(+x.dataset.del,1);save();renderBookmarks()});
}
function renderApps(){
 $('#internal').innerHTML=`
  <div class="chromePage"><h1>Chrome Uygulamaları</h1>
   <div class="tiles" style="margin:20px 0;grid-template-columns:repeat(4,120px)">
    <div class="tile" data-appgo="https://www.google.com/webhp?igu=1"><div class="tileIcon" style="background:#4285f4">G</div>Google Search</div>
    <div class="tile" data-appgo="chrome://downloads"><div class="tileIcon" style="background:#49a46b">↓</div>Downloads</div>
    <div class="tile" data-appgo="chrome://history"><div class="tileIcon" style="background:#6f8faf">↶</div>History</div>
    <div class="tile" data-appgo="chrome://settings"><div class="tileIcon" style="background:#777">⚙</div>Settings</div>
   </div>
  </div>`;
 $$('[data-appgo]').forEach(x=>x.onclick=()=>navigate(x.dataset.appgo));
}
function renderSettings(){
 $('#internal').innerHTML=`
  <div class="chromePage">
   <h1>Ayarlar</h1>
   <h2>Başlangıçta</h2>
   <div class="settingRow"><label>Ana sayfa</label><input id="homeSetting" type="text" value="${esc(state.home)}"></div>
   <h2>Görünüm</h2>
   <div class="settingRow"><label>Yer işaretleri çubuğunu her zaman göster</label><input id="showBookmarks" type="checkbox" ${state.showBookmarks?'checked':''}></div>
   <h2>Arama</h2>
   <div class="settingRow"><label>Adres çubuğunda kullanılan arama motoru</label><select disabled><option>Google</option></select></div>
   <h2>Varsayılan tarayıcı</h2>
   <div class="settingRow"><span>Google Chrome varsayılan tarayıcınız değil.</span><button class="chromeBtn" id="defaultBtn">Google Chrome'u varsayılan tarayıcım yap</button></div>
   <h2>Sistem</h2>
   <div class="warning">Windows XP üzerinde çalışan gerçek Chrome 49 güvenlik güncellemesi almaz. Bu sayfa yalnızca XP simülasyonunun parçasıdır.</div>
   <div style="text-align:right;margin-top:14px"><button class="chromeBtn" id="saveSettings">Ayarları Kaydet</button></div>
  </div>`;
 $('#saveSettings').onclick=()=>{
   state.home=$('#homeSetting').value.trim()||'chrome://newtab';
   state.showBookmarks=$('#showBookmarks').checked;save();updateBookmarkBar();
   dialog('Google Chrome','Ayarlar kaydedildi.');
 };
 $('#defaultBtn').onclick=()=>dialog('Google Chrome','Web içindeki bu simülasyon gerçek işletim sisteminin varsayılan tarayıcısını değiştiremez.');
}
function renderAbout(){
 $('#internal').innerHTML=`
  <div class="chromePage">
   <h1>Google Chrome Hakkında</h1>
   <div class="about">
    <div class="bigChrome"></div>
    <h2 style="font-size:18px">Google Chrome</h2>
    <p>Sürüm 49.0.2623.112 m</p>
    <div class="warning" style="text-align:left">
      Windows XP ve Windows Vista artık desteklenmediğinden, bu bilgisayar Google Chrome güncellemelerini artık almayacaktır.
    </div>
    <p class="small">XP Web Simulator için hazırlanmış tarayıcı arayüzü rekonstrüksiyonu.</p>
   </div>
  </div>`;
}

/* menu */
$('#menuBtn').onclick=e=>{e.stopPropagation();$('#chromeMenu').classList.toggle('show')};
document.addEventListener('mousedown',e=>{if(!e.target.closest('#chromeMenu')&&!e.target.closest('#menuBtn'))$('#chromeMenu').classList.remove('show')});
$('#chromeMenu').addEventListener('click',e=>{
 const x=e.target.closest('[data-url],[data-menu-action]');if(!x)return;
 $('#chromeMenu').classList.remove('show');
 if(x.dataset.url)navigate(x.dataset.url);
 else if(x.dataset.menuAction==='newtab')newTab();
 else if(x.dataset.menuAction==='incognito'){
   state.incognito=!state.incognito;save();$('#app').classList.toggle('incognito',state.incognito);
   dialog('Gizli mod',state.incognito?'Gizli mod görünümü etkinleştirildi. Bu simülasyon gerçek Chrome gizlilik izolasyonu sağlamaz.':'Gizli mod görünümü kapatıldı.');
 }
 else if(x.dataset.menuAction==='exit'){
   try{window.parent.postMessage({type:'XP_APP_CLOSE_REQUEST',app:'chrome'},'*')}catch{}
 }
});
$('#app').classList.toggle('incognito',state.incognito);

$('#downloadsBtn').onclick=()=>navigate('chrome://downloads');

/* fake download shelf support */
function addDownload(name='download.bin',size='—'){
 state.downloads.unshift({name,status:'Tamamlandı',size});state.downloads=state.downloads.slice(0,20);save();
 const shelf=$('#downloadShelf');shelf.innerHTML=`<div class="downloadItem">⇩ ${esc(name)} &nbsp; <span class="small">Tamamlandı</span></div><button class="chromeBtn" id="closeShelf">×</button>`;
 shelf.classList.add('show');$('#closeShelf').onclick=()=>shelf.classList.remove('show');
}

/* Dialogs */
const shade=$('#dialogShade');
function dialog(title,text,buttons){
 $('#dialogTitle').textContent=title;$('#dialogText').textContent=text;$('#dialogActions').innerHTML='';
 (buttons||[{label:'Tamam',action:hideDialog}]).forEach(b=>{
   const x=document.createElement('button');x.type='button';x.textContent=b.label;x.onclick=b.action||hideDialog;$('#dialogActions').appendChild(x);
 });
 shade.classList.add('show');
}
function hideDialog(){shade.classList.remove('show')}
$('#dialogX').onclick=hideDialog;shade.onmousedown=e=>{if(e.target===shade)hideDialog()};
window.alert=m=>dialog('Google Chrome',String(m));
window.confirm=m=>{dialog('Google Chrome',String(m));return false};
window.prompt=m=>{dialog('Google Chrome',String(m));return null};

/* keyboard shortcuts */
document.addEventListener('keydown',e=>{
 if(shade.classList.contains('show')){if(e.key==='Escape'){e.preventDefault();hideDialog()}return}
 if(e.ctrlKey&&e.key.toLowerCase()==='l'){e.preventDefault();$('#address').focus();$('#address').select()}
 else if(e.ctrlKey&&e.key.toLowerCase()==='t'){e.preventDefault();newTab()}
 else if(e.ctrlKey&&e.key.toLowerCase()==='w'){e.preventDefault();closeTab(activeId)}
 else if(e.ctrlKey&&e.key.toLowerCase()==='h'){e.preventDefault();navigate('chrome://history')}
 else if(e.ctrlKey&&e.key.toLowerCase()==='j'){e.preventDefault();navigate('chrome://downloads')}
 else if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='n'){
   e.preventDefault();state.incognito=!state.incognito;save();$('#app').classList.toggle('incognito',state.incognito)
 }
 else if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();$('#backBtn').click()}
 else if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();$('#forwardBtn').click()}
 else if(e.key==='F5'){e.preventDefault();$('#reloadBtn').click()}
});

/* iframe load updates title only to host; cross-origin content is intentionally not inspected */
$('#webframe').addEventListener('load',()=>{
 const t=activeTab();if(!t||t.url.startsWith('chrome://'))return;
 t.title=titleFor(t.url);renderTabs();
});

/* startup */
newTab('chrome://newtab');
})();
</script>

</html>
